<style>

<div id="app"></div>
<script id="ws-data" type="application/json">null</script>
<script>
(function () {
'use strict';

/* Small DOM and UI helpers used everywhere. */

const $ = (selector, root) => (root || document).querySelector(selector);

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
/** Every piece of text goes through this before it is placed in HTML. */
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ESCAPES[char]);

const LOGO = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><g fill="#fff"><circle cx="16" cy="8" r="6"/><circle cx="24" cy="14" r="6" opacity=".85"/><circle cx="21" cy="24" r="6" opacity=".7"/><circle cx="11" cy="24" r="6" opacity=".85"/><circle cx="8" cy="14" r="6"/></g><circle cx="16" cy="16" r="5.5" fill="#E4474C"/></svg>';

function toast(message) {
  const element = document.createElement('div');
  element.className = 'toast';
  element.setAttribute('role', 'status');
  element.textContent = message;
  document.body.appendChild(element);
  setTimeout(() => element.remove(), 1900);
}

/** Fallback when the clipboard is blocked: shows the text so the user can copy it by hand. */
function showText(title, text) {
  const overlay = document.createElement('div');
  overlay.className = 'ov';
  overlay.innerHTML = '<div class="box"><h3 style="margin:0 0 8px">' + esc(title) + '</h3><textarea readonly></textarea><div class="nav"><button class="sec">Close</button></div></div>';
  document.body.appendChild(overlay);
  const field = $('textarea', overlay);
  field.value = text;
  field.focus();
  field.select();
  $('button', overlay).onclick = () => overlay.remove();
}

async function copyText(text, title) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied!');
  } catch (error) {
    showText(title || 'Copy this text', text);
  }
}

/* Text matching and small deterministic helpers. No DOM here. */

/** Lower-case, no accents, only letters and digits: "Café!" and "cafe" are the same answer. */
const norm = value => String(value || '')
  .toLowerCase()
  .normalize('NFD')
  .replace(/[̀-ͯ]/g, '')
  .replace(/[^\p{L}\p{N}]/gu, '');

/** "color|colour" -> ["color", "colour"]: alternatives accepted for one answer. */
const alts = value => String(value || '').split('|').map(part => part.trim()).filter(Boolean);

/** FNV-1a: a small, stable hash used for storage keys and shuffle seeds (not for security). */
function hash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** Seeded random numbers (mulberry32), so every student sees the same shuffle for a worksheet. */
function seededRandom(seed) {
  return function next() {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(list, random) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const slug = text => String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'worksheet';

/* The worksheet data model: shapes, defaults and the question "does this item count for the score?". */

const TYPE_NAMES = {
  fill: 'Fill in the blanks',
  short: 'Short answer',
  choice: 'Multiple choice',
  truefalse: 'True / False',
  match: 'Matching',
  open: 'Open writing'
};

/** Fills in every missing field, so the rest of the app never has to check for undefined. */
function normaliseItem(type, raw) {
  const item = {
    prompt: raw.prompt || '',
    answers: raw.answers || [],
    options: raw.options || [],
    left: raw.left || '',
    right: raw.right || '',
    hint: raw.hint || '',
    explanation: raw.explanation || ''
  };
  // The server does this too; doing it here keeps hand-made worksheets (and the demo) working.
  if (type === 'truefalse' && !item.options.length) item.options = ['True', 'False'];
  if (type === 'match') {
    item.prompt = item.prompt || item.left;
    if (!item.answers.length && item.right) item.answers = [item.right];
  }
  return item;
}

function normaliseWorksheet(raw) {
  raw = raw || {};
  return {
    title: String(raw.title || 'Worksheet'),
    answerKeyFound: !!raw.answerKeyFound,
    sections: (raw.sections || []).map(section => {
      const type = section.type || 'open';
      return {
        type,
        title: section.title || '',
        instructions: section.instructions || '',
        passage: section.passage || '',
        wordBank: section.wordBank || [],
        items: (section.items || []).map(item => normaliseItem(type, item))
      };
    })
  };
}

/** JSON without empty strings and empty lists: keeps share links short. */
const slimJSON = worksheet => JSON.stringify(worksheet, (key, value) =>
  (value === '' || (Array.isArray(value) && !value.length)) ? undefined : value);

const blankCount = item => (item.prompt.match(/___/g) || []).length;

/** Open writing is never scored, and neither is an item that has no known answer. */
function isScored(section, item) {
  if (section.type === 'open') return false;
  if (section.type === 'match') return !!item.answers[0];
  return item.answers.length > 0;
}

/*
 * Grading rules. Pure functions: no DOM, no stored state.
 * `type` is the exercise type, `item` a normalised item, `value` what the student entered:
 * a list of strings for fill / short, one string for choice / truefalse / match.
 */

const firstAlternative = answer => alts(answer)[0] || '';

function fillIsCorrect(item, value) {
  const blanks = blankCount(item);
  if (!blanks) return false;
  for (let k = 0; k < blanks; k++) {
    const accepted = alts(item.answers[k] || '');
    const typed = norm((value || [])[k]);
    if (!accepted.length || !accepted.some(answer => norm(answer) === typed)) return false;
  }
  return true;
}

function shortIsCorrect(item, value) {
  if (!Array.isArray(value)) return false;
  const typed = norm(value[0]);
  return item.answers.some(answer => alts(answer).some(accepted => norm(accepted) && norm(accepted) === typed));
}

function isCorrect(type, item, value) {
  switch (type) {
    case 'fill': return fillIsCorrect(item, value);
    case 'short': return shortIsCorrect(item, value);
    case 'choice':
    case 'truefalse':
    case 'match': return typeof value === 'string' && norm(value) === norm(item.answers[0]);
    default: return false;
  }
}

/** Has the student typed or chosen anything yet? */
function hasAnswer(type, value) {
  if (type === 'fill') return Array.isArray(value) && value.some(part => String(part || '').trim());
  if (type === 'short') return Array.isArray(value) && String(value[0] || '').trim() !== '';
  return typeof value === 'string' && value !== '';
}

/** The answer to show when a student gives up. */
function answerText(type, item) {
  if (type === 'fill') return item.answers.map(firstAlternative).join(' ; ');
  return item.answers[0] ? firstAlternative(item.answers[0]) : '';
}

/** Fallback hint when the teacher or the AI wrote none: the first letter of each answer. */
function firstLetterHint(type, item) {
  if (type !== 'fill' && type !== 'short') return '';
  const answers = type === 'fill' ? item.answers.map(firstAlternative) : [answerText(type, item)];
  const masked = answers.map(word => word.split('').map((char, i) => (char === ' ' ? '  ' : (i === 0 ? char : '•'))).join(' '));
  return 'Starts with: ' + masked.join('   |   ');
}

/*
 * Share links: the whole worksheet lives in the URL hash (compressed), so no database is needed.
 * The part after "#" is never sent to the server when a student opens the link.
 */

const MAX_LINK_CHARS = 400000;
const MAX_UNPACKED_BYTES = 2 * 1024 * 1024;

const base64url = {
  encode(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  decode(text) {
    text = text.replace(/-/g, '+').replace(/_/g, '/');
    while (text.length % 4) text += '=';
    const binary = atob(text);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
};

/** Returns "s=..." (compressed) or "j=..." (plain, when the browser cannot compress). */
async function pack(worksheet) {
  const bytes = new TextEncoder().encode(slimJSON(worksheet));
  if (typeof CompressionStream !== 'undefined') {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 's=' + base64url.encode(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  return 'j=' + base64url.encode(bytes);
}

/** Reads a stream but gives up as soon as it grows past `max` bytes (protects against zip bombs). */
async function readLimited(stream, max) {
  const reader = stream.getReader();
  const parts = [];
  let size = 0;
  for (;;) {
    const chunk = await reader.read();
    if (chunk.done) break;
    size += chunk.value.length;
    if (size > max) {
      await reader.cancel();
      throw new Error('Worksheet too large');
    }
    parts.push(chunk.value);
  }
  const out = new Uint8Array(size);
  let offset = 0;
  parts.forEach(part => { out.set(part, offset); offset += part.length; });
  return out;
}

/** Turns a URL hash back into a worksheet, or returns null when it is not a worksheet link. */
async function unpack(hashText) {
  if (String(hashText).length > MAX_LINK_CHARS) return null;
  const match = String(hashText).match(/^#?([sj])=([\w-]+)$/);
  if (!match) return null;
  let bytes = base64url.decode(match[2]);
  if (match[1] === 's') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = await readLimited(stream, MAX_UNPACKED_BYTES);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/*
 * Download a worksheet as one self-contained .html file.
 * The page re-reads its own source (captured before anything is drawn) and swaps in the worksheet data.
 */

const PAGE_SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const DATA_TAG_OPEN = '<script id="ws-data" type="application/json">';
const SCRIPT_CLOSE = '</' + 'script>';

function buildStandalonePage(worksheet) {
  const start = PAGE_SOURCE.indexOf(DATA_TAG_OPEN);
  const end = PAGE_SOURCE.indexOf(SCRIPT_CLOSE, start);
  // "<" is escaped so the data can never close the script tag early.
  const json = slimJSON(worksheet).replace(/</g, '\\u003c');
  return PAGE_SOURCE.slice(0, start + DATA_TAG_OPEN.length) + json + PAGE_SOURCE.slice(end);
}

function downloadTextFile(name, text) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 3000);
}

/*
 * What a student has done so far. It lives only in that student's browser (local storage):
 * nothing is sent to a server.
 */

const STORAGE_PREFIX = 'vocabloom3:';

function freshStudentState() {
  return {
    name: '',
    values: {},          // id -> what the student typed or chose
    checked: {},         // id -> true once "Check" was pressed (typed answers)
    revealed: {},        // id -> true once the student asked to see the answer
    hintTaps: {},        // id -> how many times the hint button was pressed
    wrongAttempts: {},   // id -> number of different wrong answers
    everWrong: {},       // id -> true once a wrong answer was given
    lastWrongAnswer: {}, // id -> the last wrong answer, to avoid counting the same one twice
    practiceSkipped: false
  };
}

/** The same worksheet always maps to the same key, so a student can come back later. */
const storageKey = worksheet => STORAGE_PREFIX + hash(slimJSON(worksheet));

function loadStudentState(key) {
  try {
    const saved = JSON.parse(localStorage.getItem(key) || 'null');
    return Object.assign(freshStudentState(), saved || {});
  } catch (error) {
    return freshStudentState();
  }
}

function saveStudentState(key, state) {
  try { localStorage.setItem(key, JSON.stringify(state)); } catch (error) { /* storage full or blocked: keep going */ }
}

/* A flat index of every question in a worksheet, so the player can find one by its id. */

const itemId = (sectionIndex, itemIndex) => 's' + sectionIndex + 'i' + itemIndex;

/** The drop-down choices for a matching exercise: every right-hand side once, in a stable shuffle. */
function matchChoices(section, random) {
  const seen = {};
  const rightSides = section.items
    .map(item => item.answers[0] || item.right)
    .filter(text => text && !seen[text] && (seen[text] = true));
  return shuffle(rightSides, random);
}

function buildItemIndex(worksheet) {
  const random = seededRandom(hash(worksheet.title + '|' + worksheet.sections.length));
  const items = {};
  const matchOptions = {};

  worksheet.sections.forEach((section, sectionIndex) => {
    if (section.type === 'match') matchOptions[sectionIndex] = matchChoices(section, random);
    section.items.forEach((item, itemIndex) => {
      const id = itemId(sectionIndex, itemIndex);
      items[id] = { id, item, section, sectionIndex, itemIndex, scored: isScored(section, item) };
    });
  });

  const scoredIds = Object.keys(items).filter(id => items[id].scored);
  return { items, matchOptions, scoredIds };
}

/* HTML for the student worksheet. Everything dynamic is escaped with esc(). */

const NO_AUTOFILL = 'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';

const tipHtml = (icon, text) => (text ? '<div class="tip">' + icon + ' ' + esc(text) + '</div>' : '');

/** Wide enough for the longest accepted answer, but never absurdly narrow or wide. */
function blankWidth(item, blankIndex) {
  const answers = alts(item.answers[blankIndex] || '');
  const longest = answers.length ? Math.max.apply(null, answers.map(answer => answer.length)) : 8;
  return Math.min(20, Math.max(7, longest + 2));
}

/** A sentence with an input in place of each "___". `fieldAttrs(k)` says how to tag blank k. */
function fillPromptHtml(item, fieldAttrs) {
  const parts = item.prompt.split('___');
  const lastIndex = parts.length - 1;
  return parts.map((text, k) => esc(text) + (k < lastIndex
    ? '<input type="text" class="blk" style="width:' + blankWidth(item, k) + 'ch" ' + fieldAttrs(k) + ' ' + NO_AUTOFILL + ' aria-label="blank ' + (k + 1) + '">'
    : '')).join('');
}

const shortInputHtml = (attrs, placeholder) =>
  '<input type="text" ' + attrs + ' ' + NO_AUTOFILL + ' placeholder="' + placeholder + '" aria-label="Your answer">';

const choiceButtonsHtml = (item, attrs) =>
  '<div class="opts">' + item.options.map(option => '<button class="opt" ' + attrs + ' data-v="' + esc(option) + '">' + esc(option) + '</button>').join('') + '</div>';

const matchSelectHtml = (options, attrs) =>
  '<select ' + attrs + ' aria-label="Choose the match"><option value="">Choose&hellip;</option>' + options.map(option => '<option>' + esc(option) + '</option>').join('') + '</select>';

/* ---------- one question card ---------- */

function questionCardHtml(entry, matchOptions) {
  const { id, item, section, itemIndex, scored } = entry;
  const number = '<b>' + (itemIndex + 1) + '.</b> ';
  const prompt = '<div class="q">' + number + esc(item.prompt) + '</div>';
  const feedback = '<div class="msg" id="m-' + id + '" aria-live="polite"></div>';
  const buttons = scored
    ? '<div class="row" style="margin-top:6px"><button data-act="check" data-id="' + id + '">&#10003; Check</button><button class="sec" data-act="hint" data-id="' + id + '" aria-label="Hint">&#128161;</button></div>'
    : '';
  const card = inner => '<div class="card" id="w-' + id + '">' + inner + '</div>';

  switch (section.type) {
    case 'fill':
      return card('<div class="q">' + number + fillPromptHtml(item, k => 'data-id="' + id + '" data-k="' + k + '"') + '</div>' + buttons + feedback);
    case 'short':
      return card(prompt + shortInputHtml('data-id="' + id + '" data-k="0"', scored ? 'Type your answer' : 'Your answer') + buttons + feedback);
    case 'open':
      return '<div class="card">' + prompt + '<textarea data-id="' + id + '" data-k="0" placeholder="Write your answer here..." autocapitalize="sentences" aria-label="Your answer"></textarea></div>';
    case 'choice':
    case 'truefalse':
      return card(prompt + choiceButtonsHtml(item, 'data-act="pick" data-id="' + id + '"') + feedback);
    case 'match':
      return card(prompt + matchSelectHtml(matchOptions[entry.sectionIndex], 'data-id="' + id + '"') + feedback);
    default:
      return '';
  }
}

/* ---------- sections and the whole page ---------- */

function sectionHtml(section, sectionIndex, index) {
  const wordBank = section.wordBank.length
    ? '<details class="bank"><summary>Word bank (' + section.wordBank.length + ')</summary><div class="chips">'
      + section.wordBank.map(word => '<span class="chip" data-w="' + esc(norm(word)) + '">' + esc(word) + '</span>').join('') + '</div></details>'
    : '';
  const cards = section.items.map((item, itemIndex) => questionCardHtml(index.items[itemId(sectionIndex, itemIndex)], index.matchOptions)).join('');
  return '<div class="pl" id="sec-' + sectionIndex + '"><h3>' + esc(section.title || ('Exercise ' + (sectionIndex + 1))) + '</h3>'
    + (section.instructions ? '<p class="sub">' + esc(section.instructions) + '</p>' : '')
    + (section.passage ? '<div class="passage">' + esc(section.passage) + '</div>' : '')
    + wordBank + cards + '</div>';
}

function playerHtml(worksheet, index) {
  const hasScore = index.scoredIds.length > 0;
  const privacyLink = location.protocol === 'file:' ? '' : ' &middot; <a href="privacy.html">Privacy</a>';
  return '<div class="hero"><div class="brand-mini">' + LOGO + '<span>Vocabloom</span></div><h1>' + esc(worksheet.title) + '</h1></div>'
    + '<div class="namebar" style="max-width:720px;margin:0 auto"><input id="sname" type="text" placeholder="Your name" autocomplete="name" aria-label="Your name"><span class="date">' + new Date().toLocaleDateString('en-GB') + '</span></div>'
    + (hasScore ? '<div class="bar"><div class="t"><span>Score</span><span id="score"></span></div><div class="prog"><i id="pb"></i></div></div>' : '<div style="height:6px"></div>')
    + worksheet.sections.map((section, sectionIndex) => sectionHtml(section, sectionIndex, index)).join('')
    + '<div class="pl"><div id="mist"></div><div id="prac"></div>'
    + '<div class="final" id="final" aria-live="polite"><div class="big" id="fscore"></div><div id="fdetail" style="margin:4px 0;font-size:14px"></div><div id="fmsg"></div></div>'
    + '<div class="actions"><button class="sec" data-act="reset">Start over</button>' + (hasScore ? '<button data-act="all">Check all</button>' : '') + '</div>'
    + '<p class="foot">Made with Vocabloom' + privacyLink + '<br>Hints and explanations may be written with the help of AI.</p></div>';
}

/*
 * Optional "Practise your mistakes".
 * Re-asks, one at a time, the same questions from the PDF that the student got wrong.
 * It never changes the score and the student can skip it at any moment.
 *
 * ctx = {
 *   root, index,            where to draw, and the item index
 *   mistakeIds(),           ids the student got wrong at some point
 *   hintFor(id),            hint text for an id
 *   isSkipped(), markSkipped()
 * }
 */

const MAX_PRACTICE_TRIES = 3;

function createPractice(ctx) {
  const { root, index } = ctx;
  const run = { mode: ctx.isSkipped() ? 'closed' : 'idle', ids: [], position: 0, fixed: 0, tries: 0, resolved: false, picked: '' };

  const panel = () => $('#prac', root);
  const message = () => $('#pmsg', root);
  const currentEntry = () => index.items[run.ids[run.position]];

  /* ---------- drawing ---------- */

  function offerHtml(count) {
    return '<div class="card prac"><h3 style="margin:0 0 4px">Practise your mistakes?</h3>'
      + '<p class="sub" style="margin:0 0 10px">Optional. Try the ' + count + ' question' + (count === 1 ? '' : 's') + ' you got wrong again, one at a time. It will not change your score.</p>'
      + '<div class="actions" style="margin:0"><button data-act="p-start">Practise now</button><button class="sec" data-act="p-skip">No thanks, skip</button></div></div>';
  }

  function doneHtml() {
    return '<div class="card prac ok"><h3 style="margin:0 0 4px">Practice complete</h3>'
      + '<p style="margin:0 0 10px">' + run.fixed + ' of ' + run.ids.length + ' fixed. Well done for going back over them!</p>'
      + '<div class="actions" style="margin:0"><button class="sec" data-act="p-skip">Close</button></div></div>';
  }

  function questionHtml(entry) {
    const { item, section } = entry;
    const prompt = '<div class="q">' + esc(item.prompt) + '</div>';
    switch (section.type) {
      case 'fill': return '<div class="q">' + fillPromptHtml(item, k => 'data-pk="' + k + '"') + '</div>';
      case 'short': return prompt + shortInputHtml('data-pk="0"', 'Type your answer');
      case 'choice':
      case 'truefalse': return prompt + choiceButtonsHtml(item, 'data-act="p-pick"');
      case 'match': return prompt + matchSelectHtml(index.matchOptions[entry.sectionIndex], 'data-pk="0"');
      default: return '';
    }
  }

  function runningHtml() {
    const entry = currentEntry();
    const where = entry.section.title || ('Exercise ' + (entry.sectionIndex + 1));
    return '<div class="card prac"><div class="sub" style="margin:0 0 6px">Practice &middot; question ' + (run.position + 1) + ' of ' + run.ids.length + ' &middot; ' + esc(where) + '</div>'
      + questionHtml(entry) + '<div class="msg" id="pmsg" aria-live="polite"></div>'
      + '<div class="row" style="margin-top:8px"><button data-act="p-check" id="pchk">&#10003; Check</button><button class="sec" data-act="p-hint">&#128161; Hint</button><button data-act="p-next" id="pnext" style="display:none">Next &rarr;</button></div>'
      + '<div class="actions" style="margin:10px 0 0"><button class="ghost" data-act="p-skipq">Skip this question</button><button class="ghost" data-act="p-end">Stop practice</button></div></div>';
  }

  function render() {
    const box = panel();
    if (!box) return;
    if (run.mode === 'closed') box.innerHTML = '';
    else if (run.mode === 'done') box.innerHTML = doneHtml();
    else if (run.mode === 'run') box.innerHTML = runningHtml();
    else {
      const count = ctx.mistakeIds().length;
      box.innerHTML = count ? offerHtml(count) : '';
    }
  }

  /* ---------- answering ---------- */

  function readValue() {
    const fields = [].slice.call(panel().querySelectorAll('[data-pk]'));
    const type = currentEntry().section.type;
    if (type === 'fill' || type === 'short') return fields.map(field => field.value);
    return fields.length ? fields[0].value : run.picked;
  }

  function finishQuestion() {
    run.resolved = true;
    $('#pnext', root).style.display = '';
    $('#pchk', root).style.display = 'none';
  }

  /** Returns true when the answer was right, false when wrong, null when nothing was entered. */
  function check(value) {
    if (run.resolved) return null;
    const entry = currentEntry();
    const type = entry.section.type;
    const box = message();
    if (!hasAnswer(type, value)) {
      box.className = 'msg';
      box.textContent = 'Type or choose an answer first.';
      return null;
    }
    run.tries += 1;
    if (isCorrect(type, entry.item, value)) {
      run.fixed += 1;
      box.className = 'msg ok';
      box.innerHTML = 'Correct, well done!' + tipHtml('📘', entry.item.explanation);
      finishQuestion();
      return true;
    }
    box.className = 'msg bad';
    if (run.tries >= MAX_PRACTICE_TRIES) {
      box.innerHTML = 'Answer: <b>' + esc(answerText(type, entry.item)) + '</b>' + tipHtml('📘', entry.item.explanation);
      finishQuestion();
    } else {
      box.innerHTML = 'Not quite. Have another go.' + tipHtml('💡', ctx.hintFor(entry.id)) + (run.tries >= 2 ? tipHtml('📘', entry.item.explanation) : '');
    }
    return false;
  }

  function nextQuestion() {
    run.position += 1;
    run.tries = 0;
    run.resolved = false;
    run.picked = '';
    run.mode = run.position >= run.ids.length ? 'done' : 'run';
    render();
  }

  function start() {
    run.ids = ctx.mistakeIds().slice();
    Object.assign(run, { position: 0, fixed: 0, tries: 0, resolved: false, picked: '', mode: run.ids.length ? 'run' : 'idle' });
    render();
    const box = panel();
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function pickOption(button) {
    if (run.resolved) return;
    run.picked = button.dataset.v;
    panel().querySelectorAll('.opt').forEach(option => { option.className = 'opt'; });
    const right = check(run.picked);
    if (right !== null) button.classList.add(right ? 'ok' : 'bad');
  }

  function showHint() {
    const hint = ctx.hintFor(run.ids[run.position]);
    const box = message();
    box.className = 'msg h';
    box.textContent = hint ? '💡 ' + hint : 'No hint for this one.';
  }

  /* ---------- events from the player ---------- */

  const actions = {
    'p-start': start,
    'p-skip': () => { run.mode = 'closed'; ctx.markSkipped(); render(); },
    'p-end': () => { run.mode = 'idle'; render(); },
    'p-check': () => check(readValue()),
    'p-pick': pickOption,
    'p-hint': showHint,
    'p-next': nextQuestion,
    'p-skipq': nextQuestion
  };

  return {
    render,
    isRunning: () => run.mode === 'run',
    /** Returns true when the click belonged to the practice panel. */
    handleAction(action, button) {
      if (!actions[action]) return false;
      actions[action](button);
      return true;
    },
    /** A drop-down inside the practice panel changed. Returns true when it was handled. */
    handleChange(target) {
      if (target.tagName !== 'SELECT' || target.dataset.pk === undefined) return false;
      check(target.value);
      return true;
    },
    /** Enter pressed inside a practice field. Returns true when it was handled. */
    handleEnter(target) {
      if (target.tagName !== 'INPUT' || target.dataset.pk === undefined) return false;
      check(readValue());
      return true;
    }
  };
}

/*
 * The student worksheet: draws it, grades answers as they are given, shows feedback and the score.
 * Usage: renderPlayer(rootElement, worksheet, { persist: true|false })
 */

const INSTANT_TYPES = ['choice', 'truefalse', 'match'];   // graded as soon as the student picks
const CONFETTI_COLOURS = ['#B4252A', '#388A9F', '#1B9A5A', '#E4B43A', '#CC3366'];
const RESET_CONFIRM_MS = 3000;

function launchConfetti(container) {
  for (let i = 0; i < 34; i++) {
    const piece = document.createElement('i');
    piece.className = 'cf';
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.background = CONFETTI_COLOURS[i % CONFETTI_COLOURS.length];
    piece.style.animationDelay = (Math.random() * 0.6) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}

function renderPlayer(root, rawWorksheet, options) {
  options = options || {};
  const worksheet = normaliseWorksheet(rawWorksheet);
  const index = buildItemIndex(worksheet);
  const { items, scoredIds } = index;
  const total = scoredIds.length;
  const find = selector => $(selector, root);

  const key = storageKey(worksheet);
  let state = options.persist ? loadStudentState(key) : freshStudentState();
  const save = () => { if (options.persist) saveStudentState(key, state); };

  root.innerHTML = playerHtml(worksheet, index);

  /* ---------- reading the state of one question ---------- */

  const typeOf = id => items[id].section.type;
  const isRight = id => items[id].scored && isCorrect(typeOf(id), items[id].item, state.values[id]);
  const isAnswered = id => items[id].scored && hasAnswer(typeOf(id), state.values[id]);
  const hintFor = id => items[id].item.hint || firstLetterHint(typeOf(id), items[id].item);
  const mistakeIds = () => scoredIds.filter(id => state.everWrong[id]);

  /** none | ok (right first time) | fix (right after a mistake) | bad | rev (answer was shown) */
  function statusOf(id) {
    if (!items[id].scored) return 'none';
    if (state.revealed[id]) return 'rev';
    const gradedInstantly = INSTANT_TYPES.includes(typeOf(id));
    if (!gradedInstantly && !state.checked[id]) return 'none';
    if (!isAnswered(id)) return 'none';
    if (!isRight(id)) return 'bad';
    return state.everWrong[id] ? 'fix' : 'ok';
  }

  /** Counts a wrong answer once, however many times the student presses Check on it. */
  function recordAttempt(id) {
    if (!isAnswered(id) || isRight(id)) return;
    const snapshot = JSON.stringify(state.values[id]);
    if (state.lastWrongAnswer[id] === snapshot) return;
    state.lastWrongAnswer[id] = snapshot;
    state.wrongAttempts[id] = (state.wrongAttempts[id] || 0) + 1;
    state.everWrong[id] = true;
  }

  /* ---------- feedback on one question ---------- */

  function paintOptions(card, id, status) {
    const chosen = state.values[id];
    card.querySelectorAll('.opt').forEach(button => {
      button.className = 'opt';
      if (chosen !== undefined && button.dataset.v === chosen && status !== 'none') button.classList.add(status === 'bad' ? 'bad' : 'ok');
    });
  }

  function feedbackHtml(id, status) {
    const item = items[id].item;
    switch (status) {
      case 'ok': return 'Correct, well done!';
      case 'fix': return 'Corrected! You got this wrong at first, then fixed it.' + tipHtml('📘', item.explanation);
      case 'rev': return 'Answer: <b>' + esc(answerText(typeOf(id), item)) + '</b>' + tipHtml('📘', item.explanation);
      case 'bad': return 'Not quite. Have another go.' + tipHtml('💡', hintFor(id)) + ((state.wrongAttempts[id] || 0) >= 2 ? tipHtml('📘', item.explanation) : '');
      default: return '';
    }
  }

  function paint(id) {
    const card = find('#w-' + id);
    const message = find('#m-' + id);
    if (!card || !message) return;
    const status = statusOf(id);
    const type = typeOf(id);
    card.className = 'card' + (status === 'none' ? '' : ' ' + status);
    message.className = 'msg' + (status === 'none' ? '' : ' ' + status);
    message.innerHTML = feedbackHtml(id, status);
    if (type === 'choice' || type === 'truefalse') paintOptions(card, id, status);
    if (type === 'match' && state.values[id] !== undefined) card.querySelector('select').value = state.values[id];
  }

  function updateWordBanks() {
    worksheet.sections.forEach((section, sectionIndex) => {
      if (!section.wordBank.length) return;
      const used = new Set();
      root.querySelectorAll('#sec-' + sectionIndex + ' [data-id][data-k]').forEach(field => used.add(norm(field.value)));
      root.querySelectorAll('#sec-' + sectionIndex + ' .chip').forEach(chip => chip.classList.toggle('used', used.has(chip.dataset.w)));
    });
  }

  /* ---------- mistakes, score and final message ---------- */

  const MISTAKE_LABELS = { fix: 'Corrected', rev: 'Answer shown', bad: 'Still to fix' };

  function renderMistakes() {
    const box = find('#mist');
    if (!box) return;
    const ids = mistakeIds();
    if (!ids.length) { box.innerHTML = ''; return; }
    const cards = ids.map(id => {
      const entry = items[id];
      const status = statusOf(id);
      const pill = MISTAKE_LABELS[status] ? status : 'bad';
      const explanation = (status === 'fix' || status === 'rev') ? tipHtml('📘', entry.item.explanation) : '';
      return '<div class="mk" data-act="goto" data-id="' + id + '"><div><b>' + esc(entry.section.title || ('Exercise ' + (entry.sectionIndex + 1))) + ' &middot; Q' + (entry.itemIndex + 1) + '</b>'
        + '<span class="pill ' + pill + '">' + (MISTAKE_LABELS[status] || MISTAKE_LABELS.bad) + '</span></div>'
        + '<div class="mkp">' + esc(entry.item.prompt.replace(/___/g, '_____')) + '</div>' + explanation + '</div>';
    });
    box.innerHTML = '<h3 style="margin-top:20px">Your mistakes</h3><p class="sub">Questions you got wrong at some point. Tap one to go back to it.</p>' + cards.join('');
  }

  function countResults() {
    let right = 0, firstTime = 0, fixed = 0;
    scoredIds.forEach(id => {
      const status = statusOf(id);
      if (status === 'ok') { right++; firstTime++; }
      else if (status === 'fix') { right++; fixed++; }
    });
    return { right, firstTime, fixed };
  }

  function finalMessage(results) {
    if (results.right === total) return results.fixed ? 'All correct! Well done for fixing your mistakes.' : 'Perfect! Well done!';
    if (results.right >= total * 0.8) return 'Very good! Have another look at the ones you missed.';
    return 'Keep practising, you are getting there!';
  }

  function updateScore(showFinal) {
    if (!total) return;
    const results = countResults();
    find('#score').textContent = results.right + ' / ' + total;
    find('#pb').style.width = (results.right / total * 100) + '%';
    renderMistakes();
    if (!practice.isRunning()) practice.render();

    const final = find('#final');
    const allRight = results.right === total;
    if (!allRight && showFinal !== true) { final.classList.remove('show'); return; }
    if (allRight && !final.classList.contains('show')) launchConfetti(final);
    final.classList.add('show');
    find('#fscore').textContent = results.right + ' / ' + total;
    find('#fdetail').textContent = 'Right first time: ' + results.firstTime + ' · Corrected after a mistake: ' + results.fixed + ' · Not yet correct: ' + (total - results.right);
    find('#fmsg').textContent = finalMessage(results);
    if (showFinal === true) final.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  const practice = createPractice({
    root, index, mistakeIds, hintFor,
    isSkipped: () => state.practiceSkipped,
    markSkipped: () => { state.practiceSkipped = true; save(); }
  });

  /* ---------- what each button does ---------- */

  let resetArmedAt = 0;

  const actions = {
    check(id) {
      state.checked[id] = true;
      recordAttempt(id);
      save(); paint(id); updateScore();
    },
    hint(id) {
      const message = find('#m-' + id);
      state.hintTaps[id] = (state.hintTaps[id] || 0) + 1;
      if (state.hintTaps[id] === 1 && !state.revealed[id]) {
        const hint = hintFor(id);
        message.className = 'msg h';
        message.textContent = hint ? '💡 ' + hint : 'No hint for this one. Tap again to see the answer.';
      } else {
        state.revealed[id] = true;
        state.everWrong[id] = true;
        paint(id); updateScore();
      }
      save();
    },
    pick(id, button) {
      state.values[id] = button.dataset.v;
      recordAttempt(id);
      save(); paint(id); updateScore();
    },
    all() {
      scoredIds.forEach(id => {
        if (isAnswered(id)) { state.checked[id] = true; recordAttempt(id); }
        paint(id);
      });
      save(); updateScore(true);
    },
    goto(id) {
      const card = find('#w-' + id);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    reset(id, button) {
      if (Date.now() - resetArmedAt < RESET_CONFIRM_MS) {
        state = freshStudentState();
        save();
        renderPlayer(root, rawWorksheet, options);
        window.scrollTo(0, 0);
        return;
      }
      resetArmedAt = Date.now();
      button.textContent = 'Tap again to confirm';
      setTimeout(() => { if (button.isConnected) button.textContent = 'Start over'; }, RESET_CONFIRM_MS);
    }
  };

  root.onclick = event => {
    const button = event.target.closest('[data-act]');
    if (!button || !root.contains(button)) return;
    const action = button.dataset.act;
    if (practice.handleAction(action, button)) return;
    if (actions[action]) actions[action](button.dataset.id, button);
  };

  root.oninput = event => {
    const field = event.target;
    if (field.id === 'sname') { state.name = field.value; save(); return; }
    const id = field.dataset.id;
    if (!id || field.tagName === 'SELECT') return;
    const blankIndex = +field.dataset.k || 0;
    if (!Array.isArray(state.values[id])) state.values[id] = [];
    state.values[id][blankIndex] = field.value;
    if (state.checked[id] && !state.revealed[id]) { delete state.checked[id]; paint(id); }
    save(); updateWordBanks(); updateScore();
  };

  root.onchange = event => {
    const field = event.target;
    if (practice.handleChange(field)) return;
    if (field.tagName === 'SELECT' && field.dataset.id) {
      state.values[field.dataset.id] = field.value;
      recordAttempt(field.dataset.id);
      save(); paint(field.dataset.id); updateScore();
    }
  };

  root.onkeydown = event => {
    const field = event.target;
    if (event.key !== 'Enter' || field.tagName !== 'INPUT') return;
    if (field.dataset.pk !== undefined) { event.preventDefault(); practice.handleEnter(field); return; }
    if (!field.dataset.id) return;
    event.preventDefault();
    const checkButton = root.querySelector('[data-act="check"][data-id="' + field.dataset.id + '"]');
    if (checkButton) { checkButton.click(); field.blur(); }
  };

  /* ---------- first paint: restore what the student had already done ---------- */

  find('#sname').value = state.name || '';
  root.querySelectorAll('input[data-id],textarea[data-id]').forEach(field => {
    const saved = state.values[field.dataset.id];
    const blankIndex = +field.dataset.k || 0;
    if (Array.isArray(saved) && saved[blankIndex] !== undefined) field.value = saved[blankIndex];
  });
  Object.keys(items).forEach(paint);
  updateWordBanks();
  updateScore();
}

/* Teacher step 1: choose a PDF, type the school access code, convert. */

const MAX_PDF_BYTES = 3.1 * 1024 * 1024;
const LOADING_MESSAGES = ['Reading your PDF...', 'Finding the exercises...', 'Working out the answers...', 'Almost there...'];
const ACCESS_CODE_KEY = 'vb-code';

/* The access code is kept for this browser tab only (session storage), never in local storage. */
function rememberedAccessCode() {
  try { return sessionStorage.getItem(ACCESS_CODE_KEY) || ''; } catch (error) { return ''; }
}
function rememberAccessCode(code) {
  try { sessionStorage.setItem(ACCESS_CODE_KEY, code); } catch (error) { /* private mode: nothing to remember */ }
}

function uploadStepHtml() {
  return '<section class="panel"><h2>Upload a PDF</h2><p class="lead">Any worksheet: vocabulary, grammar, reading, true/false, matching&hellip; The AI finds the exercises and turns them into questions students can answer on a phone.</p>'
    + '<p class="sub">Privacy: the PDF is sent to an AI service to be converted. Please do not upload files that contain students&rsquo; personal data. <a href="privacy.html" target="_blank" rel="noopener">Privacy notice</a></p>'
    + '<label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf"><span id="dropt"><span class="ic">&#8593;</span>Tap to choose a PDF<br><small>or drop it here &middot; up to about 3 MB</small></span></label>'
    + '<label class="f" for="code">School access code</label><input type="password" id="code" autocomplete="current-password" placeholder="Ask your school admin">'
    + '<div class="err" id="err" role="alert" hidden></div>'
    + '<div class="btns"><button id="go" disabled>Convert to interactive page</button></div>'
    + '<div class="btns"><button class="ghost" id="demo">Try the demo worksheet</button></div></section>';
}

function showUploadError(message) {
  const box = $('#err');
  box.textContent = message;
  box.hidden = false;
}

/** Returns an error message for a file that cannot be used, or '' when it is fine. */
function problemWithFile(file) {
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return 'Please choose a PDF file.';
  if (file.size > MAX_PDF_BYTES) {
    return 'This PDF is ' + (file.size / 1048576).toFixed(1) + ' MB. The limit is about 3 MB. Compress it (for example with an online PDF compressor) and try again.';
  }
  return '';
}

const fileToBase64 = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(String(reader.result).split(',')[1]);
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

/** Full-screen "please wait" with rotating messages. Returns a function that removes it. */
function showLoadingOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'load';
  overlay.setAttribute('role', 'status');
  overlay.innerHTML = '<div class="spin"></div><div id="lm" style="font-weight:700;font-size:18px">' + LOADING_MESSAGES[0] + '</div><div style="color:#5f776f;font-size:14px">This usually takes 20&ndash;60 seconds.</div>';
  document.body.appendChild(overlay);
  let step = 0;
  const timer = setInterval(() => {
    step = Math.min(step + 1, LOADING_MESSAGES.length - 1);
    $('#lm').textContent = LOADING_MESSAGES[step];
  }, 9000);
  return () => { clearInterval(timer); overlay.remove(); };
}

async function requestConversion(file, accessCode) {
  const pdf = await fileToBase64(file);
  const response = await fetch('/api/convert', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-access-code': accessCode },
    body: JSON.stringify({ pdf })
  });
  let body = {};
  try { body = await response.json(); } catch (error) { /* not JSON: fall through to the generic error */ }
  if (!response.ok) throw new Error(body.error || ('Server error (' + response.status + ')'));
  return normaliseWorksheet(body.worksheet);
}

function renderUploadStep(session, nav) {
  $('#stage').innerHTML = uploadStepHtml();
  $('#code').value = rememberedAccessCode();

  function chooseFile(file) {
    $('#err').hidden = true;
    if (!file) return;
    const problem = problemWithFile(file);
    if (problem) { showUploadError(problem); return; }
    session.file = file;
    $('#drop').classList.add('has');
    $('#dropt').innerHTML = '<span class="ic">&#10003;</span>' + esc(file.name) + '<br><small>' + (file.size / 1024).toFixed(0) + ' KB &middot; tap to change</small>';
    $('#go').disabled = false;
  }

  async function convert() {
    if (location.protocol === 'file:') {
      showUploadError('Open the Vocabloom website to convert PDFs. This copy was opened as a plain file.');
      return;
    }
    const code = $('#code').value;
    rememberAccessCode(code);
    const hideOverlay = showLoadingOverlay();
    try {
      session.worksheet = await requestConversion(session.file, code);
      nav.go(2);
    } catch (error) {
      showUploadError(error.message || 'Something went wrong. Please try again.');
    } finally {
      hideOverlay();
    }
  }

  async function loadDemo() {
    try {
      const response = await fetch('demo.json');
      if (!response.ok) throw new Error('demo missing');
      session.worksheet = normaliseWorksheet(await response.json());
      nav.go(2);
    } catch (error) {
      showUploadError('The demo needs the website to be running (it cannot load from a plain file).');
    }
  }

  $('#file').onchange = event => chooseFile(event.target.files[0]);
  const dropZone = $('#drop');
  ['dragover', 'dragenter'].forEach(name => dropZone.addEventListener(name, event => event.preventDefault()));
  dropZone.addEventListener('drop', event => { event.preventDefault(); chooseFile(event.dataTransfer.files[0]); });
  $('#go').onclick = convert;
  $('#demo').onclick = loadDemo;
}

/* Teacher step 2: check and edit what the AI built before sharing it. */

const splitList = (text, separator) => text.split(separator).map(part => part.trim()).filter(Boolean);
const answersAsText = (section, item) => item.answers.join(section.type === 'fill' ? ' ; ' : ' | ');

const correctOptionHtml = item =>
  '<option value="">Correct answer?</option>' + item.options.map(option => '<option' + (item.answers[0] === option ? ' selected' : '') + '>' + esc(option) + '</option>').join('');

/* ---------- editor markup ---------- */

function hintAndExplanationHtml(item) {
  return '<input type="text" data-f="hint" value="' + esc(item.hint || '') + '" placeholder="Hint shown after a wrong answer (optional)" aria-label="Hint">'
    + '<input type="text" data-f="explanation" value="' + esc(item.explanation || '') + '" placeholder="Explanation (optional)" aria-label="Explanation">';
}

function itemEditorHtml(section, item, itemIndex) {
  const type = section.type;
  const header = '<div class="it" data-ii="' + itemIndex + '"><div class="top2"><span>' + (itemIndex + 1) + '.</span><button class="danger sm" data-del="item">Remove</button></div>';
  if (type === 'match') {
    return header
      + '<input type="text" data-f="left" value="' + esc(item.left || item.prompt) + '" placeholder="Left item" aria-label="Left item">'
      + '<input type="text" data-f="right" value="' + esc(item.right || item.answers[0] || '') + '" placeholder="Correct partner" aria-label="Correct partner">'
      + hintAndExplanationHtml(item) + '</div>';
  }
  let html = header + '<textarea data-f="prompt" aria-label="Question">' + esc(item.prompt) + '</textarea>';
  if (type === 'fill') {
    html += '<input type="text" data-f="answers" value="' + esc(answersAsText(section, item)) + '" placeholder="Answer for each blank, separated by ;" aria-label="Answers">'
      + '<small>Several blanks: separate with ; &middot; accepted alternatives for one blank: separate with |</small>';
  }
  if (type === 'short') {
    html += '<input type="text" data-f="answers" value="' + esc(answersAsText(section, item)) + '" placeholder="Accepted answers, separated by |" aria-label="Accepted answers">'
      + '<small>Leave empty if there is no single right answer (it will not be scored).</small>';
  }
  if (type === 'choice') {
    html += '<textarea data-f="options" placeholder="One option per line" aria-label="Options">' + esc(item.options.join('\n')) + '</textarea><select data-f="correct" aria-label="Correct option">' + correctOptionHtml(item) + '</select>';
  }
  if (type === 'truefalse') {
    html += '<select data-f="tf" aria-label="Correct answer"><option value="">No answer</option><option' + (item.answers[0] === 'True' ? ' selected' : '') + '>True</option><option' + (item.answers[0] === 'False' ? ' selected' : '') + '>False</option></select>';
  }
  if (type !== 'open') html += hintAndExplanationHtml(item);
  return html + '</div>';
}

function sectionEditorHtml(section, sectionIndex) {
  const showWordBank = section.type === 'short' || section.type === 'fill';
  return '<div class="xsec" data-si="' + sectionIndex + '"><div class="sech"><span class="tag">' + TYPE_NAMES[section.type] + '</span><button class="danger sm" data-del="sec">Remove exercise</button></div>'
    + '<input class="e" type="text" data-sf="title" value="' + esc(section.title) + '" placeholder="Exercise title" aria-label="Exercise title">'
    + '<textarea class="e" data-sf="instructions" placeholder="Instructions for students" style="min-height:48px" aria-label="Instructions">' + esc(section.instructions) + '</textarea>'
    + (section.passage ? '<textarea class="e" data-sf="passage" placeholder="Reading text" aria-label="Reading text">' + esc(section.passage) + '</textarea>' : '')
    + (showWordBank ? '<input class="e" type="text" data-sf="wordBank" value="' + esc(section.wordBank.join(', ')) + '" placeholder="Word bank (comma separated, optional)" aria-label="Word bank">' : '')
    + section.items.map((item, itemIndex) => itemEditorHtml(section, item, itemIndex)).join('') + '</div>';
}

function reviewHtml(worksheet) {
  const keyNote = worksheet.answerKeyFound
    ? '<div class="note ok"><b>Answer key found.</b> The correct answers come from your PDF.</div>'
    : '<div class="note warn"><b>No answer key in the PDF.</b> The AI worked out the answers itself. Please check them before sharing.</div>';
  return '<section class="panel"><h2>Review the exercises</h2>' + keyNote
    + '<p class="sub">The AI can make mistakes. Check the questions, answers, hints and explanations before you share the link.</p>'
    + '<label class="f">Worksheet title</label><input type="text" data-wf="title" value="' + esc(worksheet.title) + '">'
    + worksheet.sections.map(sectionEditorHtml).join('')
    + '<div class="nav"><button class="sec" id="b1">&larr; New PDF</button><button id="b3">Continue &rarr;</button></div></section>';
}

/* ---------- applying edits to the worksheet ---------- */

const ITEM_FIELD_UPDATERS = {
  prompt: (item, value) => { item.prompt = value; },
  hint: (item, value) => { item.hint = value; },
  explanation: (item, value) => { item.explanation = value; },
  left: (item, value) => { item.left = value; item.prompt = value; },
  right: (item, value) => { item.right = value; item.answers = value.trim() ? [value.trim()] : []; },
  answers: (item, value, section) => { item.answers = splitList(value, section.type === 'fill' ? ';' : '|'); },
  options: (item, value) => {
    item.options = splitList(value, '\n');
    if (item.answers[0] && !item.options.includes(item.answers[0])) item.answers = [];
  }
};

function renderReviewStep(session, nav) {
  const stage = $('#stage');
  stage.innerHTML = reviewHtml(session.worksheet);

  const sectionOf = element => {
    const box = element.closest('.xsec');
    return box ? session.worksheet.sections[+box.dataset.si] : null;
  };

  stage.oninput = event => {
    const field = event.target;
    const worksheet = session.worksheet;
    if (field.dataset.wf) { worksheet[field.dataset.wf] = field.value; return; }
    const section = sectionOf(field);
    if (!section) return;
    if (field.dataset.sf) {
      section[field.dataset.sf] = field.dataset.sf === 'wordBank' ? splitList(field.value, ',') : field.value;
      return;
    }
    const row = field.closest('.it');
    const update = ITEM_FIELD_UPDATERS[field.dataset.f];
    if (!row || !update) return;
    const item = section.items[+row.dataset.ii];
    update(item, field.value, section);
    if (field.dataset.f === 'options') row.querySelector('select[data-f=correct]').innerHTML = correctOptionHtml(item);
  };

  stage.onchange = event => {
    const field = event.target;
    const section = sectionOf(field);
    const row = field.closest('.it');
    if (!section || !row) return;
    if (field.dataset.f === 'correct' || field.dataset.f === 'tf') {
      section.items[+row.dataset.ii].answers = field.value ? [field.value] : [];
    }
  };

  stage.onclick = event => {
    const button = event.target.closest('[data-del]');
    if (!button) return;
    const sectionIndex = +button.closest('.xsec').dataset.si;
    const scrollY = window.scrollY;
    if (button.dataset.del === 'sec') session.worksheet.sections.splice(sectionIndex, 1);
    else session.worksheet.sections[sectionIndex].items.splice(+button.closest('.it').dataset.ii, 1);
    session.worksheet.sections = session.worksheet.sections.filter(section => section.items.length);
    renderReviewStep(session, nav);
    window.scrollTo(0, scrollY);
  };

  $('#b1').onclick = () => nav.go(1);
  $('#b3').onclick = () => {
    if (!session.worksheet.sections.length) { toast('Nothing left to share'); return; }
    nav.go(3);
  };
}

/* Teacher step 3: the link to give to students (the end of the flow). */

const LONG_LINK_CHARS = 6000;

function shareHtml() {
  return '<section class="panel"><h2>Share with your students</h2><p class="lead">Send them the link. It opens on any phone, no login needed.</p>'
    + '<div class="linkbox"><input type="text" id="lnk" readonly value="Preparing link..." aria-label="Link to share"><button id="cl">Copy</button></div>'
    + '<div class="note warn" id="long" hidden>This link is very long. WhatsApp and some apps may cut it. If that happens, use <b>Download</b> and send the file instead.</div>'
    + '<div class="btns"><button class="sec" id="dl">Download as a file</button><button class="ghost" id="op">Open student view</button></div>'
    + '<p class="lead" style="margin:0">Paste the link into Google Classroom, WhatsApp or anywhere else. Answers stay on each student\'s phone, so there is nothing for you to collect.</p>'
    + '<div class="phone"><div id="pv"></div></div>'
    + '<div class="nav"><button class="sec" id="b2">&larr; Edit</button><button class="sec" id="b1">New PDF</button></div></section>';
}

async function renderShareStep(session, nav) {
  const worksheet = session.worksheet;
  $('#stage').innerHTML = shareHtml();
  renderPlayer($('#pv'), worksheet, { persist: false });

  $('#b1').onclick = () => { session.worksheet = null; session.file = null; nav.go(1); };
  $('#b2').onclick = () => nav.go(2);
  $('#dl').onclick = () => { downloadTextFile(slug(worksheet.title) + '.html', buildStandalonePage(worksheet)); toast('Downloaded'); };

  let link = '';
  try {
    link = location.origin + location.pathname + '#' + await pack(worksheet);
    $('#lnk').value = link;
    $('#long').hidden = link.length < LONG_LINK_CHARS;
  } catch (error) {
    $('#lnk').value = 'Could not create a link. Use Download instead.';
  }
  $('#cl').onclick = () => { if (link) copyText(link, 'Copy the link'); };
  $('#op').onclick = () => { if (link) window.open(link, '_blank', 'noopener'); };
}

/* The teacher app: three steps (upload, review, share) sharing one session. */

function startTeacher() {
  const session = { worksheet: null, file: null };
  const steps = [null, renderUploadStep, renderReviewStep, renderShareStep];

  $('#app').innerHTML = '<div class="top"><div class="in">' + LOGO + '<div><h1>Vocabloom</h1><p>Turn any PDF worksheet into an interactive page</p></div></div></div>'
    + '<div class="steps" id="steps"><div><b>1</b>Upload</div><div><b>2</b>Review</div><div><b>3</b>Share</div></div><div class="wrap" id="stage"></div>';

  const nav = {
    go(step) {
      document.querySelectorAll('#steps div').forEach((tab, i) => {
        tab.className = (i + 1 === step) ? 'on' : (i + 1 < step ? 'done' : '');
      });
      steps[step](session, nav);
      window.scrollTo(0, 0);
    }
  };
  nav.go(1);
}

/*
 * Vocabloom: PDF -> interactive worksheet.
 * Two modes: teacher (upload, review, share) and student (worksheet only).
 * The worksheet for students comes from the link hash, or is embedded in a downloaded file.
 */

async function findWorksheet() {
  try {
    const embedded = JSON.parse($('#ws-data').textContent);
    if (embedded) return embedded;
  } catch (error) { /* nothing embedded */ }
  if (location.hash.length > 3) {
    try { return await unpack(location.hash); } catch (error) { return null; }
  }
  return null;
}

(async function start() {
  const worksheet = await findWorksheet();
  if (worksheet && worksheet.sections) {
    document.title = worksheet.title || 'Worksheet';
    renderPlayer($('#app'), worksheet, { persist: true });
  } else {
    startTeacher();
  }
})();

})();
