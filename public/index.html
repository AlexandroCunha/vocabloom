    else if (run.mode === 'run') box.innerHTML = runningHtml();
    else {
      const count = ctx.ids().length;
      box.innerHTML = ctx.idleHtml ? ctx.idleHtml(count) : (count ? offerHtml(count) : '');
    }
  }

  /* ---------- answering ---------- */

  function readValue() {
    const fields = [].slice.call(panel().querySelectorAll('[' + fieldAttr + ']'));
    const type = currentEntry().section.type;
    if (type === 'fill' || type === 'short') return fields.map(field => field.value);
    return fields.length ? fields[0].value : run.picked;
  }

  /** The question is settled (right, or the answer was shown): show "Next" and tell the owner how it went. */
  function finishQuestion(rightFirstTime) {
    run.resolved = true;
    $('#' + prefix + 'next', root).style.display = '';
    $('#' + prefix + 'chk', root).style.display = 'none';
    if (ctx.onResult) ctx.onResult(currentEntry().id, rightFirstTime);
  }

  /** Returns true when the answer was right, false when wrong, null when nothing was entered. */
  function check(value) {
    if (run.resolved) return null;
    const entry = currentEntry();
    const type = entry.section.type;
    const box = message();
    if (!hasAnswer(type, value)) {
      box.className = 'msg';
      box.textContent = 'Type or choose an answer first.';
      return null;
    }
    run.tries += 1;
    if (isCorrect(type, entry.item, value)) {
      run.fixed += 1;
      if (run.tries === 1) run.firstTime += 1;
      box.className = 'msg ok';
      box.innerHTML = 'Correct, well done!' + tipHtml('📘', entry.item.explanation);
      finishQuestion(run.tries === 1);
      return true;
    }
    box.className = 'msg bad';
    if (run.tries >= MAX_PRACTICE_TRIES) {
      box.innerHTML = 'Answer: <b>' + esc(answerText(type, entry.item)) + '</b>' + tipHtml('📘', entry.item.explanation);
      finishQuestion(false);
    } else {
      box.innerHTML = 'Not quite. Have another go.' + tipHtml('💡', ctx.hintFor(entry.id)) + (run.tries >= 2 ? tipHtml('📘', entry.item.explanation) : '');
    }
    return false;
  }

  function nextQuestion() {
    run.position += 1;
    run.tries = 0;
    run.resolved = false;
    run.picked = '';
    run.mode = run.position >= run.ids.length ? 'done' : 'run';
    render();
  }

  function start() {
    run.ids = ctx.ids().slice();
    run.index = buildIndex();
    Object.assign(run, { position: 0, fixed: 0, firstTime: 0, tries: 0, resolved: false, picked: '', mode: run.ids.length ? 'run' : 'idle' });
    render();
    const box = panel();
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function pickOption(button) {
    if (run.resolved) return;
    run.picked = button.dataset.v;
    panel().querySelectorAll('.opt').forEach(option => { option.className = 'opt'; });
    const right = check(run.picked);
    if (right !== null) button.classList.add(right ? 'ok' : 'bad');
  }

  function showHint() {
    const hint = ctx.hintFor(run.ids[run.position]);
    const box = message();
    box.className = 'msg h';
    box.textContent = hint ? '💡 ' + hint : 'No hint for this one.';
  }

  function listen(button) {
    const entry = currentEntry();
    ctx.speak(spokenText(entry.section.type, entry.item, run.resolved), button);
  }

  /* ---------- events from the player ---------- */

  const actions = {
    start,
    skip: () => { run.mode = ctx.afterClose || 'closed'; if (ctx.onClose) ctx.onClose(); render(); },
    end: () => { run.mode = 'idle'; render(); },
    check: () => check(readValue()),
    pick: pickOption,
    hint: showHint,
    next: nextQuestion,
    skipq: nextQuestion,
    say: listen
  };
  const own = {};
  Object.keys(actions).forEach(name => { own[act(name)] = actions[name]; });

  return {
    render,
    isRunning: () => run.mode === 'run',
    /** Returns true when the click belonged to this panel. */
    handleAction(action, button) {
      if (!own[action]) return false;
      own[action](button);
      return true;
    },
    /** A drop-down inside this panel changed. Returns true when it was handled. */
    handleChange(target) {
      if (target.tagName !== 'SELECT' || target.getAttribute(fieldAttr) === null) return false;
      check(target.value);
      return true;
    },
    /** Enter pressed inside one of this panel's fields. Returns true when it was handled. */
    handleEnter(target) {
      if (target.tagName !== 'INPUT' || target.getAttribute(fieldAttr) === null) return false;
      check(readValue());
      return true;
    },
    /** How the last run went. */
    result
  };
}

/*
 * The review-deck panel. It is drawn under "Your mistakes" in a worksheet and on the student's home page.
 *   - offers to keep the student's mistakes on this device (nothing is saved until they say yes);
 *   - shows what is ready to review today;
 *   - runs a review round with the same one-question-at-a-time runner as "Practise your mistakes".
 * Nothing here is ever sent anywhere.
 *
 * options = {
 *   root, panel,        where to draw (the panel's selector, for example '#deck')
 *   enabled?,           false in the teacher's preview: nothing is offered, read or saved
 *   source,             the worksheet title, kept with each card so students know where it came from
 *   mistakes?(),        the questions answered wrongly right now, as [{ type, item, choices }] (worksheet only)
 *   isDismissed?(), onDismiss?(),   remembers "No thanks" for this worksheet
 *   speak?(text, button)            read-aloud
 * }
 */

const CLEAR_CONFIRM_MS = 3000;

const questionWord = count => (count === 1 ? 'question' : 'questions');

function createDeckPanel(options) {
  const { root } = options;
  const today = () => dayNumber(new Date());
  const enabled = options.enabled !== false;
  let deck = enabled ? loadDeck(today()) : null;   // null until the student chooses to keep a deck
  let snapshot = null;                   // the cards being asked in the current round
  let clearArmedAt = 0;
  let problem = '';

  const inWorksheet = typeof options.mistakes === 'function';
  const mistakes = () => (inWorksheet ? options.mistakes() : []);
  const cardFor = source => makeCard(source.type, source.item, options.source || '', source.choices, today());

  function persist() {
    if (!deck || saveDeck(deck)) return true;
    problem = 'Your browser would not save anything on this device, so the review deck could not be kept.';
    return false;
  }

  /* ---------- what the panel shows when no round is running ---------- */

  function offerHtml(count) {
    return '<div class="card deck"><h3 style="margin:0 0 4px">Review these again later?</h3>'
      + '<p class="sub" style="margin:0 0 10px">Vocabloom can keep the ' + count + ' ' + questionWord(count) + ' you got wrong on this device and bring ' + (count === 1 ? 'it' : 'them') + ' back tomorrow, then after 3, 7, 14 and 30 days as you get ' + (count === 1 ? 'it' : 'them') + ' right. Nothing is sent anywhere, and you can delete it at any time.</p>'
      + (problem ? '<div class="msg bad">' + esc(problem) + '</div>' : '')
      + '<div class="actions" style="margin:0"><button data-act="d-save">Save to my review deck</button><button class="sec" data-act="d-no">No thanks</button></div></div>';
  }

  function emptyHomeHtml() {
    return '<div class="card deck"><h3 style="margin:0 0 4px">Your review deck</h3>'
      + '<p class="sub" style="margin:0">Nothing here yet. When you get a question wrong on a worksheet, you can keep it here and practise it again on later days. It is saved only on this device.</p></div>';
  }

  function statusHtml() {
    const stats = deckStats(deck, today());
    const keptFromHere = mistakes().filter(source => deck.cards[cardFor(source).id]).length;
    let line;
    if (stats.due > 0) {
      line = '<b>' + stats.due + '</b> ' + questionWord(stats.due) + ' ready to review today' + (stats.due > DECK_SESSION_SIZE ? ' (' + DECK_SESSION_SIZE + ' at a time).' : '.');
    } else if (stats.total > 0) {
      line = 'Nothing to review today. The next ' + (stats.nextInDays === 1 ? 'one comes back tomorrow.' : 'one comes back in ' + stats.nextInDays + ' days.');
    } else {
      line = 'Your deck is empty. Questions you get wrong on worksheets can be kept here.';
    }
    const small = stats.total + ' in your deck' + (stats.mastered ? ' &middot; ' + stats.mastered + ' learned' : '')
      + (keptFromHere ? ' &middot; ' + keptFromHere + ' from this worksheet' : '');
    const armed = Date.now() - clearArmedAt < CLEAR_CONFIRM_MS;
    return '<div class="card deck"><h3 style="margin:0 0 4px">Your review deck</h3>'
      + '<p style="margin:0 0 4px">' + line + '</p><p class="sub" style="margin:0 0 10px">' + small + '</p>'
      + (problem ? '<div class="msg bad">' + esc(problem) + '</div>' : '')
      + (needsHomeScreenHint(window) ? '<div class="tip" style="margin:0 0 10px">&#128241; ' + esc(HOME_SCREEN_HINT) + '</div>' : '')
      + '<div class="actions" style="margin:0">' + (stats.due > 0 ? '<button data-act="d-start">Review now</button>' : '')
      + '<button class="ghost" data-act="d-clear">' + (armed ? 'Tap again to delete' : 'Delete my deck') + '</button></div></div>';
  }

  function idleHtml() {
    if (!enabled) return '';
    if (deck) return statusHtml();
    if (!inWorksheet) return emptyHomeHtml();
    const count = mistakes().length;
    return count && !(options.isDismissed && options.isDismissed()) ? offerHtml(count) : '';
  }

  /* ---------- the review round ---------- */

  const round = createPractice({
    root,
    panel: options.panel,
    prefix: 'd',
    ids: () => (deck ? dueCards(deck, today()).slice(0, DECK_SESSION_SIZE).map(card => card.id) : []),
    index: () => { snapshot = deckIndex(dueCards(deck, today())); return snapshot; },
    hintFor: id => {
      const entry = snapshot && snapshot.items[id];
      return entry ? (entry.item.hint || firstLetterHint(entry.section.type, entry.item)) : '';
    },
    idleHtml,
    afterClose: 'idle',
    onResult: (id, rightFirstTime) => { answerCard(deck, id, rightFirstTime, today()); persist(); },
    speak: options.speak,
    copy: {
      running: 'Review',
      doneTitle: 'Review complete',
      done: result => result.firstTime + ' of ' + result.asked + ' right first time. Questions you got right come back later; the others tomorrow.',
      close: 'Close'
    }
  });

  /* ---------- buttons that belong to the deck itself ---------- */

  const own = {
    'd-save'() {
      deck = emptyDeck();
      mistakes().forEach(source => addCard(deck, cardFor(source), today()));
      problem = '';
      if (!persist()) deck = null;
      round.render();
    },
    'd-no'() {
      if (options.onDismiss) options.onDismiss();
      round.render();
    },
    'd-clear'(button) {
      if (Date.now() - clearArmedAt < CLEAR_CONFIRM_MS) {
        deleteDeck();
        deck = null;
        clearArmedAt = 0;
        problem = '';
        round.render();
        return;
      }
      clearArmedAt = Date.now();
      round.render();
      setTimeout(() => { if (button.isConnected && !round.isRunning()) round.render(); }, CLEAR_CONFIRM_MS);
    }
  };

  return {
    render: round.render,
    isRunning: round.isRunning,
    hasDeck: () => Boolean(deck),
    /** The student got a question wrong. If they keep a deck, it goes in (or goes back to box 1). */
    noteMistake(source) {
      if (!deck) return;
      addCard(deck, cardFor(source), today());
      persist();
    },
    /** Returns true when the click belonged to the deck panel. */
    handleAction(action, button) {
      if (own[action]) { own[action](button); return true; }
      return round.handleAction(action, button);
    },
    handleChange: round.handleChange,
    handleEnter: round.handleEnter
  };
}

/*
 * The student worksheet: draws it, grades answers as they are given, shows feedback and the score.
 * Usage: renderPlayer(rootElement, worksheet, { persist: true|false, home: true|false })
 *   persist: keep the student's answers on this device;  home: link to the student's home page.
 */

const INSTANT_TYPES = ['choice', 'truefalse', 'match'];   // graded as soon as the student picks
const CONFETTI_COLOURS = ['#B4252A', '#388A9F', '#1B9A5A', '#E4B43A', '#CC3366'];
const RESET_CONFIRM_MS = 3000;

/** One speaker for the whole page, so only one thing is ever read aloud at a time. */
let speakerInstance = null;
const sharedSpeaker = () => speakerInstance || (speakerInstance = createSpeaker(window));

function launchConfetti(container) {
  for (let i = 0; i < 34; i++) {
    const piece = document.createElement('i');
    piece.className = 'cf';
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.background = CONFETTI_COLOURS[i % CONFETTI_COLOURS.length];
    piece.style.animationDelay = (Math.random() * 0.6) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}

function renderPlayer(root, rawWorksheet, options) {
  options = options || {};
  const worksheet = normaliseWorksheet(rawWorksheet);
  const index = buildItemIndex(worksheet);
  const { items, scoredIds } = index;
  const total = scoredIds.length;
  const find = selector => $(selector, root);

  const key = storageKey(worksheet);
  let state = options.persist ? loadStudentState(key) : freshStudentState();
  const save = () => { if (options.persist) saveStudentState(key, state); };

  const speaker = sharedSpeaker();
  const speak = speaker.supported ? (text, button) => speaker.speak(text, button) : null;
  speaker.stop();

  root.innerHTML = playerHtml(worksheet, index, { listen: speaker.supported, home: Boolean(options.home) });

  /* ---------- reading the state of one question ---------- */

  const typeOf = id => items[id].section.type;
  const isRight = id => items[id].scored && isCorrect(typeOf(id), items[id].item, state.values[id]);
  const isAnswered = id => items[id].scored && hasAnswer(typeOf(id), state.values[id]);
  const hintFor = id => items[id].item.hint || firstLetterHint(typeOf(id), items[id].item);
  const mistakeIds = () => scoredIds.filter(id => state.everWrong[id]);
  const sourceOf = id => ({ type: typeOf(id), item: items[id].item, choices: index.matchOptions[items[id].sectionIndex] || [] });

  /** none | ok (right first time) | fix (right after a mistake) | bad | rev (answer was shown) */
  function statusOf(id) {
    if (!items[id].scored) return 'none';
    if (state.revealed[id]) return 'rev';
    const gradedInstantly = INSTANT_TYPES.includes(typeOf(id));
    if (!gradedInstantly && !state.checked[id]) return 'none';
    if (!isAnswered(id)) return 'none';
    if (!isRight(id)) return 'bad';
    return state.everWrong[id] ? 'fix' : 'ok';
  }

  /** The first time a question goes wrong it becomes a mistake (and joins the review deck, if the student keeps one). */
  function markMistake(id) {
    if (state.everWrong[id]) return;
    state.everWrong[id] = true;
    deckPanel.noteMistake(sourceOf(id));
  }

  /** Counts a wrong answer once, however many times the student presses Check on it. */
  function recordAttempt(id) {
    if (!isAnswered(id) || isRight(id)) return;
    const snapshot = JSON.stringify(state.values[id]);
    if (state.lastWrongAnswer[id] === snapshot) return;
    state.lastWrongAnswer[id] = snapshot;
    state.wrongAttempts[id] = (state.wrongAttempts[id] || 0) + 1;
    markMistake(id);
  }

  /* ---------- feedback on one question ---------- */

  function paintOptions(card, id, status) {
    const chosen = state.values[id];
    card.querySelectorAll('.opt').forEach(button => {
      button.className = 'opt';
      if (chosen !== undefined && button.dataset.v === chosen && status !== 'none') button.classList.add(status === 'bad' ? 'bad' : 'ok');
    });
  }

  function feedbackHtml(id, status) {
    const item = items[id].item;
    switch (status) {
      case 'ok': return 'Correct, well done!';
      case 'fix': return 'Corrected! You got this wrong at first, then fixed it.' + tipHtml('📘', item.explanation);
      case 'rev': return 'Answer: <b>' + esc(answerText(typeOf(id), item)) + '</b>' + tipHtml('📘', item.explanation);
      case 'bad': return 'Not quite. Have another go.' + tipHtml('💡', hintFor(id)) + ((state.wrongAttempts[id] || 0) >= 2 ? tipHtml('📘', item.explanation) : '');
      default: return '';
    }
  }

  function paint(id) {
    const card = find('#w-' + id);
    const message = find('#m-' + id);
    if (!card || !message) return;
    const status = statusOf(id);
    const type = typeOf(id);
    card.className = 'card' + (status === 'none' ? '' : ' ' + status);
    message.className = 'msg' + (status === 'none' ? '' : ' ' + status);
    message.innerHTML = feedbackHtml(id, status);
    if (type === 'choice' || type === 'truefalse') paintOptions(card, id, status);
    if (type === 'match' && state.values[id] !== undefined) card.querySelector('select').value = state.values[id];
  }

  function updateWordBanks() {
    worksheet.sections.forEach((section, sectionIndex) => {
      if (!section.wordBank.length) return;
      const used = new Set();
      root.querySelectorAll('#sec-' + sectionIndex + ' [data-id][data-k]').forEach(field => used.add(norm(field.value)));
      root.querySelectorAll('#sec-' + sectionIndex + ' .chip').forEach(chip => chip.classList.toggle('used', used.has(chip.dataset.w)));
    });
  }

  /* ---------- mistakes, score and final message ---------- */

  const MISTAKE_LABELS = { fix: 'Corrected', rev: 'Answer shown', bad: 'Still to fix' };

  function renderMistakes() {
    const box = find('#mist');
    if (!box) return;
    const ids = mistakeIds();
    if (!ids.length) { box.innerHTML = ''; return; }
    const cards = ids.map(id => {
      const entry = items[id];
      const status = statusOf(id);
      const pill = MISTAKE_LABELS[status] ? status : 'bad';
      const explanation = (status === 'fix' || status === 'rev') ? tipHtml('📘', entry.item.explanation) : '';
      return '<div class="mk" data-act="goto" data-id="' + id + '"><div><b>' + esc(entry.section.title || ('Exercise ' + (entry.sectionIndex + 1))) + ' &middot; Q' + (entry.itemIndex + 1) + '</b>'
        + '<span class="pill ' + pill + '">' + (MISTAKE_LABELS[status] || MISTAKE_LABELS.bad) + '</span></div>'
        + '<div class="mkp">' + esc(entry.item.prompt.replace(/___/g, '_____')) + '</div>' + explanation + '</div>';
    });
    box.innerHTML = '<h3 style="margin-top:20px">Your mistakes</h3><p class="sub">Questions you got wrong at some point. Tap one to go back to it.</p>' + cards.join('');
  }

  function countResults() {
    let right = 0, firstTime = 0, fixed = 0;
    scoredIds.forEach(id => {
      const status = statusOf(id);
      if (status === 'ok') { right++; firstTime++; }
      else if (status === 'fix') { right++; fixed++; }
    });
    return { right, firstTime, fixed };
  }

  function finalMessage(results) {
    if (results.right === total) return results.fixed ? 'All correct! Well done for fixing your mistakes.' : 'Perfect! Well done!';
    if (results.right >= total * 0.8) return 'Very good! Have another look at the ones you missed.';
    return 'Keep practising, you are getting there!';
  }

  function updateScore(showFinal) {
    if (!total) return;
    const results = countResults();
    find('#score').textContent = results.right + ' / ' + total;
    find('#pb').style.width = (results.right / total * 100) + '%';
    renderMistakes();
    if (!practice.isRunning()) practice.render();
    if (!deckPanel.isRunning()) deckPanel.render();

    const final = find('#final');
    const allRight = results.right === total;
    if (!allRight && showFinal !== true) { final.classList.remove('show'); return; }
    if (allRight && !final.classList.contains('show')) launchConfetti(final);
    final.classList.add('show');
    find('#fscore').textContent = results.right + ' / ' + total;
    find('#fdetail').textContent = 'Right first time: ' + results.firstTime + ' · Corrected after a mistake: ' + results.fixed + ' · Not yet correct: ' + (total - results.right);
    find('#fmsg').textContent = finalMessage(results);
    if (showFinal === true) final.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  const practice = createPractice({
    root, panel: '#prac', prefix: 'p',
    index, ids: mistakeIds, hintFor, speak,
    isClosed: () => state.practiceSkipped,
    onClose: () => { state.practiceSkipped = true; save(); }
  });

  const deckPanel = createDeckPanel({
    root, panel: '#deck', speak,
    enabled: Boolean(options.persist),
    source: worksheet.title,
    mistakes: () => mistakeIds().map(sourceOf),
    isDismissed: () => state.deckDismissed,
    onDismiss: () => { state.deckDismissed = true; save(); }
  });

  /* ---------- what each button does ---------- */

  let resetArmedAt = 0;

  const actions = {
    check(id) {
      state.checked[id] = true;
      recordAttempt(id);
      save(); paint(id); updateScore();
    },
    hint(id) {
      const message = find('#m-' + id);
      state.hintTaps[id] = (state.hintTaps[id] || 0) + 1;
      if (state.hintTaps[id] === 1 && !state.revealed[id]) {
        const hint = hintFor(id);
        message.className = 'msg h';
        message.textContent = hint ? '💡 ' + hint : 'No hint for this one. Tap again to see the answer.';
      } else {
        state.revealed[id] = true;
        markMistake(id);
        paint(id); updateScore();
      }
      save();
    },
    pick(id, button) {
      state.values[id] = button.dataset.v;
      recordAttempt(id);
      save(); paint(id); updateScore();
    },
    all() {
      scoredIds.forEach(id => {
        if (isAnswered(id)) { state.checked[id] = true; recordAttempt(id); }
        paint(id);
      });
      save(); updateScore(true);
    },
    goto(id) {
      const card = find('#w-' + id);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    say(id, button) {
      const settled = ['ok', 'fix', 'rev'].includes(statusOf(id));
      speaker.speak(spokenText(typeOf(id), items[id].item, settled), button);
    },
    'say-passage'(id, button) {
      speaker.speak(worksheet.sections[+button.dataset.s].passage, button);
    },
    'say-word'(id, button) {
      speaker.speak(button.textContent, button);
    },
    reset(id, button) {
      if (Date.now() - resetArmedAt < RESET_CONFIRM_MS) {
        state = freshStudentState();
        save();
        renderPlayer(root, rawWorksheet, options);
        window.scrollTo(0, 0);
        return;
      }
      resetArmedAt = Date.now();
      button.textContent = 'Tap again to confirm';
      setTimeout(() => { if (button.isConnected) button.textContent = 'Start over'; }, RESET_CONFIRM_MS);
    }
  };

  root.onclick = event => {
    const button = event.target.closest('[data-act]');
    if (!button || !root.contains(button)) return;
    const action = button.dataset.act;
    if (practice.handleAction(action, button) || deckPanel.handleAction(action, button)) return;
    if (actions[action]) actions[action](button.dataset.id, button);
  };

  root.oninput = event => {
    const field = event.target;
    if (field.id === 'sname') { state.name = field.value; save(); return; }
    const id = field.dataset.id;
    if (!id || field.tagName === 'SELECT') return;
    const blankIndex = +field.dataset.k || 0;
    if (!Array.isArray(state.values[id])) state.values[id] = [];
    state.values[id][blankIndex] = field.value;
    if (state.checked[id] && !state.revealed[id]) { delete state.checked[id]; paint(id); }
    save(); updateWordBanks(); updateScore();
  };

  root.onchange = event => {
    const field = event.target;
    if (practice.handleChange(field) || deckPanel.handleChange(field)) return;
    if (field.tagName === 'SELECT' && field.dataset.id) {
      state.values[field.dataset.id] = field.value;
      recordAttempt(field.dataset.id);
      save(); paint(field.dataset.id); updateScore();
    }
  };

  root.onkeydown = event => {
    if (moveBetweenOptions(event)) { event.preventDefault(); return; }
    const field = event.target;
    // A word in the word bank is a button made from a span: Enter and Space press it like a real button.
    if ((event.key === 'Enter' || event.key === ' ') && field.getAttribute('role') === 'button') { event.preventDefault(); field.click(); return; }
    if (event.key !== 'Enter' || field.tagName !== 'INPUT') return;
    if (practice.handleEnter(field) || deckPanel.handleEnter(field)) { event.preventDefault(); return; }
    if (!field.dataset.id) return;
    event.preventDefault();
    const checkButton = root.querySelector('[data-act="check"][data-id="' + field.dataset.id + '"]');
    if (checkButton) { checkButton.click(); field.blur(); }
  };

  /* ---------- first paint: restore what the student had already done ---------- */

  find('#sname').value = state.name || '';
  root.querySelectorAll('input[data-id],textarea[data-id]').forEach(field => {
    const saved = state.values[field.dataset.id];
    const blankIndex = +field.dataset.k || 0;
    if (Array.isArray(saved) && saved[blankIndex] !== undefined) field.value = saved[blankIndex];
  });
  Object.keys(items).forEach(paint);
  updateWordBanks();
  updateScore();
}

/*
 * The student's home page (#review): the review deck, the worksheets opened lately, and a button that
 * clears everything Vocabloom keeps on this device. It is what opens when the app is started from the
 * home screen, and it works offline.
 */

const FORGET_LABEL = 'Clear everything on this device';

function recentListHtml(list, now) {
  if (!list.length) return '<p class="sub">Worksheets you open will appear here, so you can find them again.</p>';
  return list.map(entry => '<a class="recent" href="' + esc(entry.link) + '"><span>' + esc(entry.title) + '</span><small>' + esc(openedText(entry.at, now)) + '</small></a>').join('');
}

function homeHtml(now) {
  return '<div class="hero"><div class="brand-mini">' + LOGO + '<span>Vocabloom</span></div><h1>Welcome back</h1></div>'
    + '<div class="pl home-top"><div id="deck"></div>'
    + '<h3>Your worksheets</h3>' + recentListHtml(loadRecent(), now)
    + '<div class="actions"><button class="ghost" data-act="forget">' + FORGET_LABEL + '</button></div>'
    + '<p class="sub" style="text-align:center">Your answers, your review deck and this list are saved only on this device.</p>'
    + '<p class="foot"><a href="./">Teacher? Create a worksheet</a> &middot; <a href="privacy.html">Privacy</a></p></div>';
}

function renderHome(root) {
  const speaker = sharedSpeaker();
  speaker.stop();
  const speak = speaker.supported ? (text, button) => speaker.speak(text, button) : null;
  document.title = 'Vocabloom';
  let deckPanel = null;
  let forgetArmedAt = 0;

  function draw() {
    root.innerHTML = homeHtml(Date.now());
    deckPanel = createDeckPanel({ root, panel: '#deck', speak });
    deckPanel.render();
  }

  function forget(button) {
    if (Date.now() - forgetArmedAt < CLEAR_CONFIRM_MS) {
      forgetArmedAt = 0;
      clearLocalData();
      draw();
      toast('Cleared');
      return;
    }
    forgetArmedAt = Date.now();
    button.textContent = 'Tap again to clear';
    setTimeout(() => { if (button.isConnected) button.textContent = FORGET_LABEL; }, CLEAR_CONFIRM_MS);
  }

  root.onclick = event => {
    const button = event.target.closest('[data-act]');
    if (!button || !root.contains(button)) return;
    if (deckPanel.handleAction(button.dataset.act, button)) return;
    if (button.dataset.act === 'forget') forget(button);
  };
  root.oninput = null;
  root.onchange = event => { deckPanel.handleChange(event.target); };
  root.onkeydown = event => {
    if (moveBetweenOptions(event)) { event.preventDefault(); return; }
    if (event.key === 'Enter' && event.target.tagName === 'INPUT' && deckPanel.handleEnter(event.target)) event.preventDefault();
  };
  draw();
}

/* Teacher step 1: choose a PDF, type the school access code, convert. */

const MAX_PDF_BYTES = 3.1 * 1024 * 1024;
const LOADING_MESSAGES = ['Reading your PDF...', 'Finding the exercises...', 'Working out the answers...', 'Almost there...'];
const ACCESS_CODE_KEY = 'vb-code';

/* The access code is kept for this browser tab only (session storage), never in local storage. */
function rememberedAccessCode() {
  try { return sessionStorage.getItem(ACCESS_CODE_KEY) || ''; } catch (error) { return ''; }
}
function rememberAccessCode(code) {
  try { sessionStorage.setItem(ACCESS_CODE_KEY, code); } catch (error) { /* private mode: nothing to remember */ }
}

/* Wording that fits the device: "Tap" on a phone, "Click" and "drop it here" where there is a mouse (see .touch-only and .mouse-only). */
const TAP_OR_CLICK = '<span class="touch-only">tap</span><span class="mouse-only">click</span>';
const DROP_BOX_TEXT = '<span class="ic">&#8593;</span><span class="touch-only">Tap</span><span class="mouse-only">Click</span> to choose a PDF<br>'
  + '<small><span class="mouse-only">or drop it here &middot; </span>up to about 3 MB</small>';

function uploadStepHtml() {
  return '<section class="panel up"><div class="up-intro"><h2>Upload a PDF</h2><p class="lead">Any worksheet: vocabulary, grammar, reading, true/false, matching&hellip; The AI finds the exercises and turns them into questions students can answer on a phone.</p>'
    + '<p class="sub">Privacy: the PDF is sent to an AI service to be converted. Please do not upload files that contain students&rsquo; personal data. <a href="privacy.html" target="_blank" rel="noopener">Privacy notice</a></p></div>'
    + '<div class="up-form"><label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf"><span id="dropt">' + DROP_BOX_TEXT + '</span></label>'
    + '<label class="f" for="code">School access code</label><input type="password" id="code" autocomplete="current-password" placeholder="Ask your school admin">'
    + '<div class="err" id="err" role="alert" hidden></div>'
    + '<div class="btns"><button id="go" disabled>Convert to interactive page</button></div>'
    + '<div class="btns"><button class="ghost" id="demo">Try the demo worksheet</button></div></div></section>';
}

function showUploadError(message) {
  const box = $('#err');
  box.textContent = message;
  box.hidden = false;
}

/** Returns an error message for a file that cannot be used, or '' when it is fine. */
function problemWithFile(file) {
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return 'Please choose a PDF file.';
  if (file.size > MAX_PDF_BYTES) {
    return 'This PDF is ' + (file.size / 1048576).toFixed(1) + ' MB. The limit is about 3 MB. Compress it (for example with an online PDF compressor) and try again.';
  }
  return '';
}

const fileToBase64 = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(String(reader.result).split(',')[1]);
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

/** Full-screen "please wait" with rotating messages. Returns a function that removes it. */
function showLoadingOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'load';
  overlay.setAttribute('role', 'status');
  overlay.innerHTML = '<div class="spin"></div><div id="lm" style="font-weight:700;font-size:18px">' + LOADING_MESSAGES[0] + '</div><div style="color:#5f776f;font-size:14px">This usually takes 20&ndash;60 seconds.</div>';
  document.body.appendChild(overlay);
  let step = 0;
  const timer = setInterval(() => {
    step = Math.min(step + 1, LOADING_MESSAGES.length - 1);
    $('#lm').textContent = LOADING_MESSAGES[step];
  }, 9000);
  return () => { clearInterval(timer); overlay.remove(); };
}

/**
 * Returns { worksheet, cached }. `cached` is true when the server already had a result for this exact PDF.
 * `fresh` asks for a new conversion instead (it uses AI credit again and replaces the saved result).
 */
async function requestConversion(file, accessCode, fresh) {
  const pdf = await fileToBase64(file);
  const response = await fetch('/api/convert', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-access-code': accessCode },
    body: JSON.stringify(fresh ? { pdf, fresh: true } : { pdf })
  });
  let body = {};
  try { body = await response.json(); } catch (error) { /* not JSON: fall through to the generic error */ }
  if (!response.ok) throw new Error(body.error || ('Server error (' + response.status + ')'));
  return { worksheet: normaliseWorksheet(body.worksheet), cached: Boolean(body.cached) };
}

/** "Convert again" in the review step. Errors are shown as a short message, since the upload screen is gone. */
async function convertAgain(session, nav) {
  const hideOverlay = showLoadingOverlay();
  try {
    const result = await requestConversion(session.file, rememberedAccessCode(), true);
    Object.assign(session, { worksheet: result.worksheet, cached: result.cached, shortLink: null });
    nav.go(2);
  } catch (error) {
    toast(error.message || 'Something went wrong. Please try again.');
  } finally {
    hideOverlay();
  }
}

function renderUploadStep(session, nav) {
  $('#stage').innerHTML = uploadStepHtml();
  $('#code').value = rememberedAccessCode();

  function chooseFile(file) {
    $('#err').hidden = true;
    if (!file) return;
    const problem = problemWithFile(file);
    if (problem) { showUploadError(problem); return; }
    session.file = file;
    $('#drop').classList.add('has');
    $('#dropt').innerHTML = '<span class="ic">&#10003;</span>' + esc(file.name) + '<br><small>' + (file.size / 1024).toFixed(0) + ' KB &middot; ' + TAP_OR_CLICK + ' to change</small>';
    $('#go').disabled = false;
  }

  async function convert() {
    if (location.protocol === 'file:') {
      showUploadError('Open the Vocabloom website to convert PDFs. This copy was opened as a plain file.');
      return;
    }
    const code = $('#code').value;
    rememberAccessCode(code);
    const hideOverlay = showLoadingOverlay();
    try {
      const result = await requestConversion(session.file, code);
      Object.assign(session, { worksheet: result.worksheet, cached: result.cached, shortLink: null });
      nav.go(2);
    } catch (error) {
      showUploadError(error.message || 'Something went wrong. Please try again.');
    } finally {
      hideOverlay();
    }
  }

  async function loadDemo() {
    try {
      const response = await fetch('demo.json');
      if (!response.ok) throw new Error('demo missing');
      Object.assign(session, { worksheet: normaliseWorksheet(await response.json()), file: null, cached: false, shortLink: null });
      nav.go(2);
    } catch (error) {
      showUploadError('The demo needs the website to be running (it cannot load from a plain file).');
    }
  }

  $('#file').onchange = event => chooseFile(event.target.files[0]);
  // The whole panel accepts a dropped file, and the box lights up while one is over it.
  const dropZone = $('#drop');
  const panel = $('.up');
  ['dragenter', 'dragover'].forEach(name => panel.addEventListener(name, event => {
    if (!dragHasFiles(event)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'copy';
    dropZone.classList.add('over');
  }));
  panel.addEventListener('dragleave', event => { if (!panel.contains(event.relatedTarget)) dropZone.classList.remove('over'); });
  panel.addEventListener('drop', event => {
    if (!dragHasFiles(event)) return;
    event.preventDefault();
    dropZone.classList.remove('over');
    chooseFile(event.dataTransfer.files[0]);
  });
  $('#go').onclick = convert;
  $('#demo').onclick = loadDemo;
}

/* Teacher step 2: check and edit what the AI built before sharing it. */

const splitList = (text, separator) => text.split(separator).map(part => part.trim()).filter(Boolean);
/* Answers are typed exactly as students will type them: no capital letter at the start, no automatic correction. */
const PLAIN_TEXT = 'autocapitalize="off" autocorrect="off"';
const answersAsText = (section, item) => item.answers.join(section.type === 'fill' ? ' ; ' : ' | ');

const correctOptionHtml = item =>
  '<option value="">Correct answer?</option>' + item.options.map(option => '<option' + (item.answers[0] === option ? ' selected' : '') + '>' + esc(option) + '</option>').join('');

/* ---------- editor markup ---------- */

function hintAndExplanationHtml(item) {
  return '<input type="text" data-f="hint" value="' + esc(item.hint || '') + '" placeholder="Hint shown after a wrong answer (optional)" aria-label="Hint">'
    + '<input type="text" data-f="explanation" value="' + esc(item.explanation || '') + '" placeholder="Explanation (optional)" aria-label="Explanation">';
}

function itemEditorHtml(section, item, itemIndex) {
  const type = section.type;
  const header = '<div class="it" data-ii="' + itemIndex + '"><div class="top2"><span>' + (itemIndex + 1) + '.</span><button class="danger sm" data-del="item">Remove</button></div>';
  if (type === 'match') {
    return header
      + '<input type="text" data-f="left" value="' + esc(item.left || item.prompt) + '" placeholder="Left item" aria-label="Left item" ' + PLAIN_TEXT + '>'
      + '<input type="text" data-f="right" value="' + esc(item.right || item.answers[0] || '') + '" placeholder="Correct partner" aria-label="Correct partner" ' + PLAIN_TEXT + '>'
      + hintAndExplanationHtml(item) + '</div>';
  }
  let html = header + '<textarea data-f="prompt" aria-label="Question">' + esc(item.prompt) + '</textarea>';
  if (type === 'fill') {
    html += '<input type="text" data-f="answers" value="' + esc(answersAsText(section, item)) + '" placeholder="Answer for each blank, separated by ;" aria-label="Answers" ' + PLAIN_TEXT + '>'
      + '<small>Several blanks: separate with ; &middot; accepted alternatives for one blank: separate with |</small>';
  }
  if (type === 'short') {
    html += '<input type="text" data-f="answers" value="' + esc(answersAsText(section, item)) + '" placeholder="Accepted answers, separated by |" aria-label="Accepted answers" ' + PLAIN_TEXT + '>'
      + '<small>Leave empty if there is no single right answer (it will not be scored).</small>';
  }
  if (type === 'choice') {
    html += '<textarea data-f="options" placeholder="One option per line" aria-label="Options" ' + PLAIN_TEXT + '>' + esc(item.options.join('\n')) + '</textarea><select data-f="correct" aria-label="Correct option">' + correctOptionHtml(item) + '</select>';
  }
  if (type === 'truefalse') {
    html += '<select data-f="tf" aria-label="Correct answer"><option value="">No answer</option><option' + (item.answers[0] === 'True' ? ' selected' : '') + '>True</option><option' + (item.answers[0] === 'False' ? ' selected' : '') + '>False</option></select>';
  }
  if (type !== 'open') html += hintAndExplanationHtml(item);
  return html + '</div>';
}

function sectionEditorHtml(section, sectionIndex) {
  const showWordBank = section.type === 'short' || section.type === 'fill';
  return '<div class="xsec" data-si="' + sectionIndex + '"><div class="sech"><span class="tag">' + TYPE_NAMES[section.type] + '</span><button class="danger sm" data-del="sec">Remove exercise</button></div>'
    + '<input class="e" type="text" data-sf="title" value="' + esc(section.title) + '" placeholder="Exercise title" aria-label="Exercise title">'
    + '<textarea class="e" data-sf="instructions" placeholder="Instructions for students" style="min-height:48px" aria-label="Instructions">' + esc(section.instructions) + '</textarea>'
    + (section.passage ? '<textarea class="e" data-sf="passage" placeholder="Reading text" aria-label="Reading text">' + esc(section.passage) + '</textarea>' : '')
    + (showWordBank ? '<input class="e" type="text" data-sf="wordBank" value="' + esc(section.wordBank.join(', ')) + '" placeholder="Word bank (comma separated, optional)" aria-label="Word bank" ' + PLAIN_TEXT + '>' : '')
    + section.items.map((item, itemIndex) => itemEditorHtml(section, item, itemIndex)).join('') + '</div>';
}

/** Shown when the server already had a conversion of this exact PDF. The teacher can ask for a new one. */
const cachedNoteHtml = '<div class="note ok" id="cachednote"><b>Saved result.</b> This PDF was converted before, so you are seeing that result and no AI credit was used. '
  + 'If it does not look right, <button class="ghost sm" id="again" style="margin-left:4px">Convert again</button></div>';

function reviewHtml(worksheet, cached) {
  const keyNote = worksheet.answerKeyFound
    ? '<div class="note ok"><b>Answer key found.</b> The correct answers come from your PDF.</div>'
    : '<div class="note warn"><b>No answer key in the PDF.</b> The AI worked out the answers itself. Please check them before sharing.</div>';
  return '<section class="panel"><h2>Review the exercises</h2>' + keyNote + (cached ? cachedNoteHtml : '')
    + '<p class="sub">The AI can make mistakes. Check the questions, answers, hints and explanations before you share the link.</p>'
    + '<label class="f">Worksheet title</label><input type="text" data-wf="title" value="' + esc(worksheet.title) + '">'
    + worksheet.sections.map(sectionEditorHtml).join('')
    + '<div class="nav"><button class="sec" id="b1">&larr; New PDF</button><button id="b3">Continue &rarr;</button></div></section>';
}

/* ---------- applying edits to the worksheet ---------- */

const ITEM_FIELD_UPDATERS = {
  prompt: (item, value) => { item.prompt = value; },
  hint: (item, value) => { item.hint = value; },
  explanation: (item, value) => { item.explanation = value; },
  left: (item, value) => { item.left = value; item.prompt = value; },
  right: (item, value) => { item.right = value; item.answers = value.trim() ? [value.trim()] : []; },
  answers: (item, value, section) => { item.answers = splitList(value, section.type === 'fill' ? ';' : '|'); },
  options: (item, value) => {
    item.options = splitList(value, '\n');
    if (item.answers[0] && !item.options.includes(item.answers[0])) item.answers = [];
  }
};

function renderReviewStep(session, nav) {
  const stage = $('#stage');
  stage.innerHTML = reviewHtml(session.worksheet, session.cached && session.file);

  const sectionOf = element => {
    const box = element.closest('.xsec');
    return box ? session.worksheet.sections[+box.dataset.si] : null;
  };

  stage.oninput = event => {
    const field = event.target;
    const worksheet = session.worksheet;
    if (field.dataset.wf) { worksheet[field.dataset.wf] = field.value; return; }
    const section = sectionOf(field);
    if (!section) return;
    if (field.dataset.sf) {
      section[field.dataset.sf] = field.dataset.sf === 'wordBank' ? splitList(field.value, ',') : field.value;
      return;
    }
    const row = field.closest('.it');
    const update = ITEM_FIELD_UPDATERS[field.dataset.f];
    if (!row || !update) return;
    const item = section.items[+row.dataset.ii];
    update(item, field.value, section);
    if (field.dataset.f === 'options') row.querySelector('select[data-f=correct]').innerHTML = correctOptionHtml(item);
  };

  stage.onchange = event => {
    const field = event.target;
    const section = sectionOf(field);
    const row = field.closest('.it');
    if (!section || !row) return;
    if (field.dataset.f === 'correct' || field.dataset.f === 'tf') {
      section.items[+row.dataset.ii].answers = field.value ? [field.value] : [];
    }
  };

  stage.onclick = event => {
    const button = event.target.closest('[data-del]');
    if (!button) return;
    const sectionIndex = +button.closest('.xsec').dataset.si;
    const scrollY = window.scrollY;
    if (button.dataset.del === 'sec') session.worksheet.sections.splice(sectionIndex, 1);
    else session.worksheet.sections[sectionIndex].items.splice(+button.closest('.it').dataset.ii, 1);
    session.worksheet.sections = session.worksheet.sections.filter(section => section.items.length);
    renderReviewStep(session, nav);
    window.scrollTo(0, scrollY);
  };

  $('#b1').onclick = () => nav.go(1);
  if ($('#again')) $('#again').onclick = () => convertAgain(session, nav);
  $('#b3').onclick = () => {
    if (!session.worksheet.sections.length) { toast('Nothing left to share'); return; }
    nav.go(3);
  };
}

/*
 * Teacher step 3: the link to give to students (the end of the flow).
 *   - the normal link carries the whole worksheet inside it, so nothing is stored anywhere;
 *   - optionally, a short link plus a QR code: the worksheet is then kept on the server for a while.
 */

const LONG_LINK_CHARS = 6000;

/** `canShare`: the device has its own share sheet (iPhone, Android, Windows), which is the easiest way to send a link. */
function shareHtml(canShare) {
  return '<section class="panel share"><div class="share-main"><h2>Share with your students</h2><p class="lead">Send them the link. It opens on any phone, no login needed.</p>'
    + '<div class="linkbox"><input type="text" id="lnk" readonly value="Preparing link..." aria-label="Link to share"><button id="cl">Copy</button></div>'
    + '<div class="note warn" id="long" hidden></div>'
    + '<div class="btns">' + (canShare ? '<button class="wide" id="sh">Share&hellip;</button>' : '')
    + '<button class="sec" id="dl">Download as a file</button><button class="ghost" id="op">Open student view</button></div>'
    + '<div id="short"></div>'
    + '<p class="lead" style="margin:0">Paste the link into Google Classroom, WhatsApp or anywhere else. Answers stay on each student\'s phone, so there is nothing for you to collect.</p></div>'
    + '<aside class="share-preview" aria-label="What students see"><p class="sub">What students see</p><div class="phone"><div id="pv"></div></div></aside>'
    + '<div class="nav share-nav"><button class="sec" id="b2">&larr; Edit</button><button class="sec" id="b1">New PDF</button></div></section>';
}

const shortLinkUrl = id => location.origin + location.pathname + '#w=' + id;

/** The link to hand over right now: the short one if it was made for this exact worksheet, otherwise the long one. */
function bestLink(session, longLink) {
  const made = session.shortLink;
  return made && made.key === hash(slimJSON(session.worksheet)) ? shortLinkUrl(made.id) : longLink;
}

/** The device's own share sheet (Messages, WhatsApp, Mail...). Closing it without choosing anything is not an error. */
async function shareWithDevice(title, url) {
  try {
    await navigator.share({ title, url });
  } catch (error) {
    if (!error || error.name !== 'AbortError') copyText(url, 'Copy the link');
  }
}

/* ---------- short link and QR code ---------- */

/** Short links need the server to keep a copy, so they only exist when the school has switched that on. */
async function shortLinksAvailable() {
  if (location.protocol === 'file:') return false;
  try {
    const response = await fetch('/api/share');
    return response.ok && Boolean((await response.json()).available);
  } catch (error) {
    return false;
  }
}

/** Asks the server to keep the worksheet and returns { id, days }. */
async function requestShortLink(worksheet, accessCode) {
  const response = await fetch('/api/share', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-access-code': accessCode },
    body: '{"worksheet":' + slimJSON(worksheet) + '}'
  });
  let body = {};
  try { body = await response.json(); } catch (error) { /* not JSON: fall through to the generic error */ }
  if (!response.ok) throw new Error(body.error || ('Server error (' + response.status + ')'));
  return body;
}

function shortLinkHtml(needsCode) {
  return '<div class="shortbox"><h3>Short link and QR code</h3>'
    + '<p class="sub">Handy for the classroom screen or a printed sheet. To keep the link short, Vocabloom stores a copy of this worksheet on its server for a limited time. Student answers are never sent there.</p>'
    + (needsCode ? '<label class="f" for="scode">School access code</label><input type="password" id="scode" autocomplete="current-password" placeholder="Ask your school admin">' : '')
    + '<div class="err" id="serr" role="alert" hidden></div>'
    + '<div class="btns"><button id="mk">Create short link and QR code</button></div>'
    + '<div id="made" hidden>'
    + '<div class="qr" id="qr"></div>'
    + '<div class="linkbox"><input type="text" id="slnk" readonly aria-label="Short link"><button id="scopy">Copy</button></div>'
    + '<div class="btns"><button class="sec" id="qbig">Show large</button><button class="sec" id="qpng">Download QR code</button></div>'
    + '<p class="sub" id="sinfo"></p></div></div>';
}

/** Full-screen QR code, for a classroom projector. */
function showQrLarge(matrix, link) {
  const overlay = document.createElement('div');
  overlay.className = 'ov';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-label', 'QR code');
  overlay.innerHTML = '<div class="box qrbig"><div class="qr">' + qrSvg(matrix) + '</div><p class="qrlink">' + esc(link) + '</p><div class="nav"><button class="sec" id="qclose">Close</button></div></div>';
  const close = showOverlay(overlay);
  $('#qclose', overlay).onclick = close;
  $('#qclose', overlay).focus();
}

function downloadQrPng(matrix, name) {
  const canvas = document.createElement('canvas');
  qrDrawCanvas(canvas, matrix, 1024);
  canvas.toBlob(blob => {
    if (blob) { downloadBlob(name, blob); toast('Downloaded'); } else toast('Could not make the image');
  }, 'image/png');
}

/** Wires up the short-link box. `session.shortLink` remembers the link made for this exact worksheet. */
function setUpShortLink(session, box) {
  const worksheet = session.worksheet;
  const worksheetKey = hash(slimJSON(worksheet));
  const needsCode = !rememberedAccessCode();
  box.innerHTML = shortLinkHtml(needsCode);

  function showResult(result) {
    const link = shortLinkUrl(result.id);
    const matrix = qrMatrix(link);
    $('#qr').innerHTML = qrSvg(matrix);
    $('#slnk').value = link;
    $('#sinfo').textContent = 'Students who open this link load the worksheet from Vocabloom, and their answers still stay on their own phones. The link stops working after ' + result.days + ' days.';
    $('#made').hidden = false;
    $('#scopy').onclick = () => copyText(link, 'Copy the link');
    $('#qbig').onclick = () => showQrLarge(matrix, link);
    $('#qpng').onclick = () => downloadQrPng(matrix, slug(worksheet.title) + '-qr.png');
  }

  async function create() {
    $('#serr').hidden = true;
    const typed = needsCode ? $('#scode').value : '';
    if (typed) rememberAccessCode(typed);
    const button = $('#mk');
    button.disabled = true;
    try {
      const result = await requestShortLink(worksheet, rememberedAccessCode());
      session.shortLink = { key: worksheetKey, id: result.id, days: result.days };
      showResult(session.shortLink);
      button.textContent = 'Create a new short link';
    } catch (error) {
      $('#serr').textContent = error.message || 'Something went wrong. Please try again.';
      $('#serr').hidden = false;
    } finally {
      button.disabled = false;
    }
  }

  $('#mk').onclick = create;
  if (session.shortLink && session.shortLink.key === worksheetKey) {
    showResult(session.shortLink);
    $('#mk').textContent = 'Create a new short link';
  }
}

/* ---------- the step itself ---------- */

async function renderShareStep(session, nav) {
  const worksheet = session.worksheet;
  const thisRender = session.shareRender = (session.shareRender || 0) + 1;
  const canShare = typeof navigator.share === 'function';
  $('#stage').innerHTML = shareHtml(canShare);
  renderPlayer($('#pv'), worksheet, { persist: false });

  $('#b1').onclick = () => { session.worksheet = null; session.file = null; session.shortLink = null; nav.go(1); };
  $('#b2').onclick = () => nav.go(2);
  $('#dl').onclick = () => { downloadTextFile(slug(worksheet.title) + '.html', buildStandalonePage(worksheet)); toast('Downloaded'); };

  let link = '';
  try {
    link = location.origin + location.pathname + '#' + await pack(worksheet);
    $('#lnk').value = link;
  } catch (error) {
    $('#lnk').value = 'Could not create a link. Use Download instead.';
  }
  $('#cl').onclick = () => { if (link) copyText(link, 'Copy the link'); };
  $('#op').onclick = () => { if (link) window.open(link, '_blank', 'noopener'); };
  if (canShare) $('#sh').onclick = () => { if (link) shareWithDevice(worksheet.title, bestLink(session, link)); };

  const canShorten = await shortLinksAvailable();
  if (thisRender !== session.shareRender || !$('#short')) return;   // the teacher already moved on
  if (canShorten) setUpShortLink(session, $('#short'));
  if (link.length >= LONG_LINK_CHARS) {
    const note = $('#long');
    note.innerHTML = 'This link is very long. WhatsApp and some apps may cut it. '
      + (canShorten ? 'Create a short link below, or use <b>Download</b> and send the file instead.' : 'Use <b>Download</b> and send the file instead.');
    note.hidden = false;
  }
}

/* The teacher app: three steps (upload, review, share) sharing one session. */

function startTeacher() {
  const session = { worksheet: null, file: null };
  const steps = [null, renderUploadStep, renderReviewStep, renderShareStep];

  $('#app').className = 'teacher';   // on a computer the teacher's tool uses a wider column than the student's page

  $('#app').innerHTML = '<div class="top"><div class="in">' + LOGO + '<div><h1>Vocabloom</h1><p>Turn any PDF worksheet into an interactive page</p></div></div></div>'
    + '<div class="steps" id="steps"><div><b>1</b>Upload</div><div><b>2</b>Review</div><div><b>3</b>Share</div></div><div class="wrap" id="stage"></div>';

  const nav = {
    go(step) {
      document.querySelectorAll('#steps div').forEach((tab, i) => {
        tab.className = (i + 1 === step) ? 'on' : (i + 1 < step ? 'done' : '');
      });
      steps[step](session, nav);
      window.scrollTo(0, 0);
    }
  };
  nav.go(1);
}

/*
 * Vocabloom: PDF -> interactive worksheet. One page that shows a different view depending on its address:
 *
 *   a downloaded .html file   the worksheet that was saved inside it
 *   #review                   the student's home: review deck and recently opened worksheets
 *   #s=... or #j=...          a worksheet carried inside the link
 *   #w=...                    a short link: the worksheet is fetched from the server
 *   anything else             the teacher's tool: upload, review, share
 */

const SHORT_ID = /^[A-Za-z0-9_-]{12}$/;

/** What a student sees when a link cannot be opened: [title, explanation]. */
const LINK_PROBLEMS = {
  incomplete: ['This link does not work', 'It looks incomplete. Ask your teacher to send it again.'],
  expired: ['This link has expired', 'Ask your teacher to send you a new link.'],
  busy: ['Please wait a moment', 'Too many worksheets are being opened right now. Try again in a minute.'],
  offline: ['You are offline', 'This worksheet has not been opened on this phone yet. Connect to the internet and open the link once. After that it works offline.'],
  unavailable: ['Could not open the worksheet', 'Check your connection and try again.']
};

class LinkProblem extends Error {
  constructor(kind) {
    super(kind);
    this.kind = kind;
  }
}

function readEmbeddedWorksheet() {
  try {
    const embedded = JSON.parse($('#ws-data').textContent);
    return embedded && embedded.sections ? embedded : null;
  } catch (error) {
    return null;
  }
}

/** Fetches the worksheet behind a short link. A worksheet opened before is also served offline (see sw.js). */
async function fetchShortLink(id) {
  let response;
  try {
    response = await fetch('/api/share?id=' + encodeURIComponent(id));
  } catch (error) {
    throw new LinkProblem(navigator.onLine === false ? 'offline' : 'unavailable');
  }
  if (response.status === 404) throw new LinkProblem('expired');
  if (response.status === 429) throw new LinkProblem('busy');
  let body = null;
  try { body = await response.json(); } catch (error) { /* not JSON */ }
  if (!response.ok || !body || !body.worksheet) throw new LinkProblem('unavailable');
  return body.worksheet;
}

/** The worksheet a link points to. Throws a LinkProblem when it cannot be opened. */
async function worksheetFromHash(hash) {
  if (/^#w=/.test(hash)) {
    const id = hash.slice(3);
    if (!SHORT_ID.test(id)) throw new LinkProblem('incomplete');
    return fetchShortLink(id);
  }
  let worksheet = null;
  try { worksheet = await unpack(hash); } catch (error) { /* damaged link */ }
  if (!worksheet || !worksheet.sections) throw new LinkProblem('incomplete');
  return worksheet;
}

function showLinkProblem(kind, retry) {
  const [title, text] = LINK_PROBLEMS[kind] || LINK_PROBLEMS.unavailable;
  $('#app').innerHTML = '<div class="hero"><div class="brand-mini">' + LOGO + '<span>Vocabloom</span></div><h1>' + esc(title) + '</h1></div>'
    + '<div class="pl home-top"><div class="card"><p style="margin:0 0 12px">' + esc(text) + '</p>'
    + '<div class="actions" style="margin:0"><button id="retry">Try again</button></div></div>'
    + '<p class="foot"><a href="#review">My review deck</a></p></div>';
  $('#retry').onclick = retry;
}

function showWorksheet(worksheet, hash) {
  document.title = worksheet.title || 'Worksheet';
  // Only a worksheet opened from a link has a home page to go back to; a downloaded file is the whole app.
  renderPlayer($('#app'), worksheet, { persist: true, home: Boolean(hash) && location.protocol !== 'file:' });
  if (hash) rememberRecent(worksheet.title, hash, Date.now());
}

let navigation = 0;   // a newer navigation cancels an older one that is still loading

async function route() {
  const ticket = ++navigation;
  const hash = location.hash;
  window.scrollTo(0, 0);
  $('#app').className = '';

  if (hash === '#review') {
    setOfflineMessage('student');
    renderHome($('#app'));
    return;
  }
  if (/^#(?:[sj]=|w=)/.test(hash)) {
    setOfflineMessage('student');
    $('#app').innerHTML = '<div class="wrap"><p class="sub" role="status" style="padding-top:24px">Opening your worksheet&hellip;</p></div>';
    try {
      const worksheet = await worksheetFromHash(hash);
      if (ticket === navigation) showWorksheet(worksheet, hash);
    } catch (error) {
      if (ticket === navigation) showLinkProblem(error.kind || 'unavailable', route);
    }
    return;
  }
  setOfflineMessage('teacher');
  startTeacher();
}

(function start() {
  watchConnection();
  // A file dropped anywhere but on the upload box would make the browser open it and leave the page.
  ['dragover', 'drop'].forEach(name => window.addEventListener(name, event => { if (dragHasFiles(event)) event.preventDefault(); }));
  const embedded = readEmbeddedWorksheet();
  if (embedded) {
    showWorksheet(embedded, '');
    return;
  }
  registerServiceWorker();
  window.addEventListener('hashchange', route);
  route();
})();

})();
</script>
</body>
</html>
