<!DOCTYPE html>
<!-- Generated by scripts/build.js from src/. Edit the files in src/, then run: npm run build -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6E83">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Interactive English worksheets that students answer on their phones.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocabloom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%231F6E83%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23B4252A%27/%3E%3C/svg%3E">
<title>Vocabloom</title>
<style>
/* Design tokens, resets and shared controls. */
:root{--bg:#F2F8F9;--card:#fff;--ink:#16262D;--text:#33434B;--mute:#677B83;--line:#DCE8EB;
--teal:#388A9F;--teal2:#1F6E83;--teal3:#14586B;--tealbg:#E6F3F6;
--red:#B4252A;--red2:#8F1C20;--pink:#CC3366;
--ok:#1B9A5A;--okbg:#E7F6EE;--bad:#D6453D;--badbg:#FDEDEB;--rev:#A9730A;--revbg:#FFF4DC;--fix:#2563B8;--fixbg:#E8F0FD;
--shadow:0 10px 30px rgba(20,88,107,.10);--r:20px;
/* Width of the page column, and the space the notch and home indicator take on an iPhone (0 everywhere else). */
--col:720px;--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* No double-tap zoom or tap delay on anything that can be pressed. */
a,button,input,select,textarea,summary,label,[role=button]{touch-action:manipulation}
body{margin:0;font-family:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-weight:400}
h1,h2,h3{font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;color:var(--ink)}
a{color:var(--teal2);text-underline-offset:2px}
/* Hover colours only where there is a mouse: on a phone a tap would leave them stuck. */
@media (hover:hover){a:hover{color:var(--teal3)}}
a:focus-visible,button:focus-visible,summary:focus-visible,.chip[data-act]:focus-visible,.say:focus-visible{outline:3px solid rgba(56,138,159,.55);outline-offset:2px}
button{font-family:inherit;font-size:15.5px;border:0;border-radius:14px;padding:0 18px;min-height:48px;background:var(--red);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 8px 18px rgba(180,37,42,.22);transition:transform .12s,background .15s,box-shadow .15s}
@media (hover:hover){button:hover{background:var(--red2)}}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.sec{background:var(--tealbg);color:var(--teal3);box-shadow:none}
@media (hover:hover){button.sec:hover{background:#d4eaef}}
button.ghost{background:#fff;color:var(--teal3);border:1.5px solid var(--teal);box-shadow:none}
@media (hover:hover){button.ghost:hover{background:var(--tealbg)}}
button.danger{background:var(--badbg);color:var(--bad);box-shadow:none}
button.sm{min-height:36px;font-size:13.5px;padding:0 12px;border-radius:12px}
input[type=text],input[type=password],textarea,select{width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:68px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(56,138,159,.18)}
.wrap{max-width:var(--col);margin:0 auto;padding:0 max(14px,var(--sar)) calc(48px + var(--sab)) max(14px,var(--sal))}

/* Header, steps, upload / review / share screens, loading overlay. */
/* hero / header */
.top,.hero{color:#fff;background:radial-gradient(circle at 92% -10%,rgba(255,255,255,.22),transparent 42%),radial-gradient(circle at 0% 105%,rgba(255,255,255,.12),transparent 45%),linear-gradient(135deg,#3F95AB 0%,#1F7790 50%,#14586B 100%)}
.top{padding:calc(22px + var(--sat)) max(16px,var(--sar)) 46px max(16px,var(--sal));border-radius:0 0 30px 30px}
.top .in{max-width:var(--col);margin:0 auto;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:28px;letter-spacing:-.3px;color:#fff;line-height:1.1}
.top p{margin:2px 0 0;font-size:13px;font-weight:300;opacity:.92}
.steps{display:flex;gap:8px;max-width:var(--col);margin:-26px auto 16px;padding:0 max(14px,var(--sar)) 0 max(14px,var(--sal));position:relative}
.steps div{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:var(--mute);border-radius:16px;font-size:13px;padding:10px 6px;font-weight:600;box-shadow:var(--shadow);transition:all .2s}
.steps div b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--tealbg);color:var(--teal3);font-size:12px}
.steps div.on{background:var(--teal3);color:#fff}
.steps div.on b{background:var(--red);color:#fff}
.steps div.done{color:var(--teal3)}
.steps div.done b{background:var(--teal);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);animation:up .4s both}
.panel h2{margin:0 0 4px;font-size:24px;letter-spacing:-.2px}
.lead{margin:0 0 16px;color:var(--mute);font-size:14px}
label.f{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px;color:var(--ink)}
.drop{position:relative;display:block;border:2px dashed #9CCAD6;border-radius:var(--r);background:linear-gradient(180deg,#F4FAFB,#E9F5F8);text-align:center;padding:30px 14px;cursor:pointer;font-weight:600;color:var(--teal3);transition:all .2s}
@media (hover:hover){.drop:hover{border-color:var(--teal);transform:translateY(-1px)}}
/* a file is being dragged over the box */
.drop.over{border-style:solid;border-color:var(--teal);background:var(--tealbg);box-shadow:0 0 0 4px rgba(56,138,159,.18)}
.drop:has(input:focus-visible){outline:3px solid rgba(56,138,159,.55);outline-offset:2px}
.drop.has{border-style:solid;border-color:var(--teal);background:var(--tealbg)}
/* The file input stays in the page (not display:none) so the keyboard can reach it. */
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.mouse-only{display:none}
@media (hover:hover) and (pointer:fine){.touch-only{display:none}.mouse-only{display:inline}}
.drop small{font-weight:400;color:var(--mute)}
.drop .ic{display:block;margin:0 auto 8px;width:46px;height:46px;border-radius:14px;background:var(--red);color:#fff;font-size:24px;line-height:46px;box-shadow:0 8px 18px rgba(180,37,42,.25)}
.err{background:var(--badbg);color:#A5302A;border-radius:14px;padding:11px 14px;margin:14px 0;font-size:14px}
.note{border-radius:14px;padding:11px 14px;margin:12px 0;font-size:14px}
.note.ok{background:var(--okbg);color:#14663D}
.note.warn{background:var(--revbg);color:#7A5400}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btns button{flex:1 1 150px}
.btns button.wide{flex-basis:100%}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1}
.load{position:fixed;inset:0;background:rgba(242,248,249,.96);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:max(20px,var(--sat)) max(20px,var(--sar)) max(20px,var(--sab)) max(20px,var(--sal))}
.spin{width:58px;height:58px;border-radius:50%;border:6px solid #D2E8EE;border-top-color:var(--red);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}

/* review */
.xsec{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;background:#FAFDFD}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tag{background:var(--tealbg);color:var(--teal3);font-weight:700;font-size:11.5px;padding:5px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.xsec .e{margin-top:8px}
.it{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff;display:grid;gap:8px}
.it .top2{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--red)}
.it small{color:var(--mute);font-size:12.5px}
.phone{border:2px solid var(--line);border-radius:26px;background:var(--bg);padding:0 0 12px;margin-top:14px;overflow:hidden;box-shadow:inset 0 0 0 6px #fff}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;font-size:13px}

/* short link and QR code */
.shortbox{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;background:#FAFDFD}
.shortbox h3{margin:0 0 4px;font-size:18px}
.qr{max-width:260px;margin:12px auto}
.qr svg{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.box.qrbig{text-align:center}
.qrbig .qr{max-width:min(78vw,60vh);max-width:min(78vw,60dvh)}
.qrlink{word-break:break-all;font-size:14px;color:var(--mute);margin:10px 0 0}

/* The student worksheet: hero, cards, feedback, mistakes, practice, results. */
/* worksheet (player) */
.hero{padding:calc(26px + var(--sat)) max(16px,var(--sar)) 50px max(16px,var(--sal));text-align:center;border-radius:0 0 34px 34px}
.hero h1{margin:8px 0 2px;font-size:30px;letter-spacing:-.4px;color:#fff;line-height:1.15}
.brand-mini{display:inline-flex;gap:8px;align-items:center;font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:15px;opacity:.95;letter-spacing:.3px}
.namebar{display:flex;gap:10px;align-items:center;padding:0 max(14px,var(--sar)) 0 max(14px,var(--sal));max-width:var(--col);margin:0 auto;position:relative}
.namebar input{box-shadow:var(--shadow);border-color:transparent}
.namebar .date{color:var(--mute);font-size:13px;white-space:nowrap;background:#fff;padding:12px 14px;border-radius:14px;box-shadow:var(--shadow)}
.bar{position:sticky;top:0;z-index:5;background:rgba(242,248,249,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + var(--sat)) max(16px,var(--sar)) 12px max(16px,var(--sal));border-bottom:1px solid var(--line);margin-top:14px}
.bar .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--ink);max-width:var(--col);margin:0 auto}
.prog{height:9px;background:#D9E8EC;border-radius:8px;overflow:hidden;margin:6px auto 0;max-width:var(--col)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--ok));border-radius:8px;transition:width .4s}
.pl{padding:0 max(14px,var(--sar)) 0 max(14px,var(--sal));max-width:var(--col);margin:0 auto}
.pl h3{font-size:21px;margin:30px 2px 4px;color:var(--teal3);border-left:5px solid var(--red);padding-left:12px;line-height:1.25}
.pl .sub{margin:0 2px 12px;color:var(--mute);font-size:14px}
.passage{background:#fff;border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:16px;padding:14px 16px;white-space:pre-wrap;margin-bottom:12px;font-size:16px;box-shadow:var(--shadow)}
details.bank{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
details.bank summary{font-weight:600;cursor:pointer;color:var(--teal3)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:5px 12px;border-radius:999px;background:var(--tealbg);color:var(--teal3);font-size:14px;font-weight:500;border:1px solid #C5E2EA;transition:opacity .2s}
.chip.used{opacity:.35;text-decoration:line-through}
.card{background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow);animation:up .35s both;transition:background .2s,border-color .2s}
.card.ok{border-color:var(--ok);background:var(--okbg);animation:pop .35s}
.card.bad{border-color:var(--bad);background:var(--badbg)}
.card.rev{border-color:#E3B64A;background:var(--revbg)}
.card.fix{border-color:var(--fix);background:var(--fixbg);animation:pop .35s}
.q{font-size:16px;margin-bottom:10px;line-height:1.75;color:var(--ink)}
.q,.passage{display:flow-root}
.q b{color:#fff;background:var(--teal);border-radius:8px;padding:1px 8px;margin-right:6px;font-size:13px;font-weight:600}
input.blk{display:inline-block;width:10ch;max-width:100%;padding:3px 9px;margin:0 3px;border-radius:10px;border:1.5px solid var(--line);border-bottom:3px solid var(--teal);font-size:16px;background:#fff}
.row{display:flex;gap:8px}
.msg{font-size:14px;margin-top:8px}
.msg.ok{color:var(--ok);font-weight:600}.msg.bad{color:#B4382F;font-weight:600}.msg.rev{color:var(--rev);font-weight:600}.msg.h{color:var(--mute)}.msg.fix{color:var(--fix);font-weight:600}
.tip{margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.8);border-radius:12px;font-size:14px;color:var(--text);font-weight:400}
.opts{display:grid;gap:9px}
.opt{background:#fff;color:var(--ink);border:1.5px solid var(--line);text-align:left;padding:12px 16px;box-shadow:none;font-weight:500;border-radius:14px}
@media (hover:hover){.opt:hover{background:var(--tealbg);border-color:var(--teal)}}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.mk{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.mkp{color:var(--mute);font-size:14px;margin-top:6px}
.mk>div:first-child{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{flex:none;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.fix{background:var(--fixbg);color:var(--fix)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.rev{background:var(--revbg);color:var(--rev)}
.actions{display:flex;gap:10px;margin:14px 0}
.actions button{flex:1}
.final{display:none;position:relative;overflow:hidden;text-align:center;background:linear-gradient(160deg,#fff,#EAF5F8);border:2px solid var(--teal);border-radius:24px;padding:22px 16px;margin:18px 0;box-shadow:var(--shadow)}
.final.show{display:block;animation:up .4s both}
.final .big{font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;font-size:52px;font-weight:700;color:var(--teal3);line-height:1}
.foot{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 6px;padding-bottom:var(--sab)}
.toast{position:fixed;left:50%;bottom:calc(26px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:80;box-shadow:var(--shadow)}
.ov{position:fixed;inset:0;background:rgba(10,30,38,.55);z-index:70;display:flex;justify-content:center;overflow-y:auto;overscroll-behavior:contain;padding:max(16px,var(--sat)) max(16px,var(--sar)) max(16px,var(--sab)) max(16px,var(--sal))}
.ov .box{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:560px;margin:auto}
.ov textarea{min-height:200px;font-size:13px}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall 2.4s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(260px) rotate(540deg)}}
/* read aloud */
.say{float:right;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;min-height:40px;padding:0;margin:0 0 6px 10px;border-radius:50%;background:var(--tealbg);color:var(--teal3);box-shadow:none;font-size:17px;line-height:1}
@media (hover:hover){.say:hover{background:#d4eaef}}
.say.speaking{background:var(--teal3);color:#fff}
.chip[data-act]{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (hover:hover){.chip[data-act]:hover{background:#d4eaef}}
.chip.speaking{background:var(--teal3);color:#fff;border-color:var(--teal3)}
/* review deck, student home, offline bar */
.card.deck{border-color:#C5E2EA;background:linear-gradient(160deg,#fff,#F2F9FB)}
@media (max-width:359px){.card.deck .actions{flex-direction:column}.card.deck .actions button{flex:none}}
.home-top{margin-top:-26px;position:relative}
.recent{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:10px;color:var(--ink);font-weight:600;text-decoration:none;box-shadow:var(--shadow)}
@media (hover:hover){.recent:hover{border-color:var(--teal)}}
.recent small{color:var(--mute);font-weight:400;white-space:nowrap}
.net{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--ink);color:#fff;text-align:center;font-size:13.5px;padding:10px max(14px,var(--sar)) calc(10px + var(--sab)) max(14px,var(--sal))}
.net[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Adjustments for particular devices. Loaded last, so they override the phone-first rules above. */

/* ---- A phone held sideways: very little height, so the header gives some of it back ---- */
@media (orientation:landscape) and (max-height:500px){
.top{padding-top:calc(10px + var(--sat));padding-bottom:36px}
.top h1{font-size:22px}
.top p{display:none}
.hero{padding-top:calc(10px + var(--sat));padding-bottom:36px}
.hero h1{font-size:22px;margin:2px 0 0}
.brand-mini{font-size:13px}
.steps div{padding-top:6px;padding-bottom:6px}
.bar{padding-top:calc(6px + var(--sat));padding-bottom:8px;margin-top:8px}
.pl h3{margin-top:20px}
/* the large QR code has to fit above the Close button without scrolling */
.qrbig .qr{max-width:46vh;max-width:46dvh}
}

/* ---- Touch screens: fields need 16px or more, or Safari on iPhone zooms the page when one is selected ---- */
@media (pointer:coarse){
.linkbox input,.ov textarea{font-size:16px}
}

/* ---- Wider screens ---- */
@media (min-width:640px){
/* short answers (True / False, single words) sit side by side */
.opts.short{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
}
@media (min-width:900px){
:root{--col:760px}
}

/* ---- Computers: the teacher's tool uses the room ---- */
@media (min-width:1000px){
.teacher{--col:960px}
.teacher .panel{padding:28px 32px}

/* upload: what it is on the left, the form on the right */
.up{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:0 40px;align-items:start}
.up-intro h2{font-size:30px}
.up-form .drop{margin-top:2px}

/* review: the fields of each question sit in two columns */
.it{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.it>.top2,.it>[data-f=prompt]{grid-column:1/-1}
.it>[data-f=hint]{grid-column:1}
.it>[data-f=explanation]{grid-column:2}
.it>small{align-self:center}

/* share: link and QR code on the left, what students see on the right (it stays in view while the page scrolls) */
.share{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"main preview" "nav preview";gap:0 36px;align-items:start}
.share-main{grid-area:main}
.share-preview{grid-area:preview;position:sticky;top:16px}
.share-nav{grid-area:nav}
.share-preview .phone{margin-top:0;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow:auto;overscroll-behavior:contain}
}
</style>
</head>
<body>
<div id="app"></div>
<script id="ws-data" type="application/json">null</script>
<script>
(function () {
'use strict';

/* Small DOM and UI helpers used everywhere. */

const $ = (selector, root) => (root || document).querySelector(selector);

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
/** Every piece of text goes through this before it is placed in HTML. */
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ESCAPES[char]);

const LOGO = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><g fill="#fff"><circle cx="16" cy="8" r="6"/><circle cx="24" cy="14" r="6" opacity=".85"/><circle cx="21" cy="24" r="6" opacity=".7"/><circle cx="11" cy="24" r="6" opacity=".85"/><circle cx="8" cy="14" r="6"/></g><circle cx="16" cy="16" r="5.5" fill="#E4474C"/></svg>';

function toast(message) {
  const element = document.createElement('div');
  element.className = 'toast';
  element.setAttribute('role', 'status');
  element.textContent = message;
  document.body.appendChild(element);
  setTimeout(() => element.remove(), 1900);
}

/**
 * Shows an overlay (a dark backdrop holding a box). Escape or a click on the backdrop closes it,
 * and focus goes back to what had it before. Returns the function that closes the overlay.
 */
function showOverlay(overlay) {
  const opener = document.activeElement;
  document.body.appendChild(overlay);
  const onKey = event => { if (event.key === 'Escape') close(); };
  function close() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
    if (opener && opener.isConnected && typeof opener.focus === 'function') opener.focus();
  }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
  return close;
}

/** Fallback when the clipboard is blocked: shows the text so the user can copy it by hand. */
function showText(title, text) {
  const overlay = document.createElement('div');
  overlay.className = 'ov';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-label', title);
  overlay.innerHTML = '<div class="box"><h3 style="margin:0 0 8px">' + esc(title) + '</h3><textarea readonly></textarea><div class="nav"><button class="sec">Close</button></div></div>';
  const close = showOverlay(overlay);
  const field = $('textarea', overlay);
  field.value = text;
  field.focus();
  field.select();
  $('button', overlay).onclick = close;
}

/** True when a drag carries files (and not, say, selected text). */
const dragHasFiles = event => Array.from((event.dataTransfer && event.dataTransfer.types) || []).indexOf('Files') !== -1;

const ARROW_STEPS = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };

/**
 * Arrow keys move between the answer buttons of one question, so a keyboard user does not have to Tab through
 * every one. Returns true when the key was used.
 */
function moveBetweenOptions(event) {
  const step = ARROW_STEPS[event.key];
  const current = event.target;
  if (!step || !current.classList || !current.classList.contains('opt')) return false;
  const group = Array.from(current.parentNode.querySelectorAll('.opt'));
  const next = group[(group.indexOf(current) + step + group.length) % group.length];
  if (next) next.focus();
  return true;
}

async function copyText(text, title) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied!');
  } catch (error) {
    showText(title || 'Copy this text', text);
  }
}

/* Text matching and small deterministic helpers. No DOM here. */

/** Lower-case, no accents, only letters and digits: "Café!" and "cafe" are the same answer. */
const norm = value => String(value || '')
  .toLowerCase()
  .normalize('NFD')
  .replace(/[̀-ͯ]/g, '')
  .replace(/[^\p{L}\p{N}]/gu, '');

/** "color|colour" -> ["color", "colour"]: alternatives accepted for one answer. */
const alts = value => String(value || '').split('|').map(part => part.trim()).filter(Boolean);

/** FNV-1a: a small, stable hash used for storage keys and shuffle seeds (not for security). */
function hash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** Seeded random numbers (mulberry32), so every student sees the same shuffle for a worksheet. */
function seededRandom(seed) {
  return function next() {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(list, random) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const slug = text => String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'worksheet';

/* The worksheet data model: shapes, defaults and the question "does this item count for the score?". */

const TYPE_NAMES = {
  fill: 'Fill in the blanks',
  short: 'Short answer',
  choice: 'Multiple choice',
  truefalse: 'True / False',
  match: 'Matching',
  open: 'Open writing'
};

/** Fills in every missing field, so the rest of the app never has to check for undefined. */
function normaliseItem(type, raw) {
  const item = {
    prompt: raw.prompt || '',
    answers: raw.answers || [],
    options: raw.options || [],
    left: raw.left || '',
    right: raw.right || '',
    hint: raw.hint || '',
    explanation: raw.explanation || ''
  };
  // The server does this too; doing it here keeps hand-made worksheets (and the demo) working.
  if (type === 'truefalse' && !item.options.length) item.options = ['True', 'False'];
  if (type === 'match') {
    item.prompt = item.prompt || item.left;
    if (!item.answers.length && item.right) item.answers = [item.right];
  }
  return item;
}

function normaliseWorksheet(raw) {
  raw = raw || {};
  return {
    title: String(raw.title || 'Worksheet'),
    answerKeyFound: !!raw.answerKeyFound,
    sections: (raw.sections || []).map(section => {
      const type = section.type || 'open';
      return {
        type,
        title: section.title || '',
        instructions: section.instructions || '',
        passage: section.passage || '',
        wordBank: section.wordBank || [],
        items: (section.items || []).map(item => normaliseItem(type, item))
      };
    })
  };
}

/** JSON without empty strings and empty lists: keeps share links short. */
const slimJSON = worksheet => JSON.stringify(worksheet, (key, value) =>
  (value === '' || (Array.isArray(value) && !value.length)) ? undefined : value);

const blankCount = item => (item.prompt.match(/___/g) || []).length;

/** Open writing is never scored, and neither is an item that has no known answer. */
function isScored(section, item) {
  if (section.type === 'open') return false;
  if (section.type === 'match') return !!item.answers[0];
  return item.answers.length > 0;
}

/*
 * Grading rules. Pure functions: no DOM, no stored state.
 * `type` is the exercise type, `item` a normalised item, `value` what the student entered:
 * a list of strings for fill / short, one string for choice / truefalse / match.
 */

const firstAlternative = answer => alts(answer)[0] || '';

function fillIsCorrect(item, value) {
  const blanks = blankCount(item);
  if (!blanks) return false;
  for (let k = 0; k < blanks; k++) {
    const accepted = alts(item.answers[k] || '');
    const typed = norm((value || [])[k]);
    if (!accepted.length || !accepted.some(answer => norm(answer) === typed)) return false;
  }
  return true;
}

function shortIsCorrect(item, value) {
  if (!Array.isArray(value)) return false;
  const typed = norm(value[0]);
  return item.answers.some(answer => alts(answer).some(accepted => norm(accepted) && norm(accepted) === typed));
}

function isCorrect(type, item, value) {
  switch (type) {
    case 'fill': return fillIsCorrect(item, value);
    case 'short': return shortIsCorrect(item, value);
    case 'choice':
    case 'truefalse':
    case 'match': return typeof value === 'string' && norm(value) === norm(item.answers[0]);
    default: return false;
  }
}

/** Has the student typed or chosen anything yet? */
function hasAnswer(type, value) {
  if (type === 'fill') return Array.isArray(value) && value.some(part => String(part || '').trim());
  if (type === 'short') return Array.isArray(value) && String(value[0] || '').trim() !== '';
  return typeof value === 'string' && value !== '';
}

/** The answer to show when a student gives up. */
function answerText(type, item) {
  if (type === 'fill') return item.answers.map(firstAlternative).join(' ; ');
  return item.answers[0] ? firstAlternative(item.answers[0]) : '';
}

/** Fallback hint when the teacher or the AI wrote none: the first letter of each answer. */
function firstLetterHint(type, item) {
  if (type !== 'fill' && type !== 'short') return '';
  const answers = type === 'fill' ? item.answers.map(firstAlternative) : [answerText(type, item)];
  const masked = answers.map(word => word.split('').map((char, i) => (char === ' ' ? '  ' : (i === 0 ? char : '•'))).join(' '));
  return 'Starts with: ' + masked.join('   |   ');
}

/*
 * Read-aloud for questions, reading texts and words, using the browser's own speech synthesis.
 * Nothing is sent by Vocabloom itself. Only the worksheet's text is ever spoken, never what a student typed.
 *
 * The helpers (spokenText, splitForSpeech, pickVoice) have no DOM and are unit-tested.
 * createSpeaker wraps window.speechSynthesis; nothing plays until a student presses a button.
 */

const SPEECH_LANG = 'en-GB';
const SPEECH_RATE = 0.9;           // a little slower than normal, for learners
const SPEECH_CHUNK_CHARS = 180;    // some browsers stop long utterances, so long texts are read in pieces

/** Spoken text should not contain stray spaces or doubled punctuation. */
function tidySpeech(text) {
  return String(text)
    .replace(/\s+/g, ' ')
    .replace(/\s+([,.;:!?])/g, '$1')
    .replace(/,(\s*,)+/g, ',')
    .replace(/,\s*([.;:!?])/g, '$1')
    .replace(/^[,;\s]+/, '')
    .trim();
}

/**
 * What to say for one question. A blank is spoken as a short pause and the word "blank";
 * once the question is settled (`revealAnswers`) the right answer is read in its place.
 */
function spokenText(type, item, revealAnswers) {
  const answerFor = k => firstAlternative((type === 'fill' ? item.answers[k] : (k === 0 ? item.answers[0] : '')) || '');
  const prompt = String(item.prompt || '');
  const hasBlank = prompt.indexOf('___') !== -1;
  let blankNumber = 0;
  let text = prompt.replace(/___/g, () => {
    const answer = revealAnswers ? answerFor(blankNumber) : '';
    blankNumber += 1;
    return answer ? ' ' + answer + ' ' : ', blank, ';
  });
  // A new sentence is added after the question: end it properly first, so there is never a double full stop.
  const then = extra => { text = tidySpeech(text); text = (/[.!?:;]$/.test(text) ? text : text + '.') + ' ' + extra; };
  if (type === 'choice' && !revealAnswers) then(item.options.join('. '));
  if (revealAnswers && !hasBlank && item.answers[0]) then('Answer: ' + firstAlternative(item.answers[0]));
  return tidySpeech(text);
}

/** Splits a text at sentence ends into pieces of at most `maxChars` characters. */
function splitForSpeech(text, maxChars) {
  const pieces = String(text).match(/[^.!?;:\n]+[.!?;:]*/g) || [];
  const chunks = [];
  let current = '';
  pieces.forEach(raw => {
    const piece = raw.trim();
    if (!piece) return;
    if (piece.length > maxChars) {
      if (current) { chunks.push(current); current = ''; }
      let rest = piece;
      while (rest.length > maxChars) {
        let cut = rest.lastIndexOf(' ', maxChars);
        if (cut < maxChars / 2) cut = maxChars;
        chunks.push(rest.slice(0, cut).trim());
        rest = rest.slice(cut).trim();
      }
      current = rest;
    } else if (current && current.length + 1 + piece.length > maxChars) {
      chunks.push(current);
      current = piece;
    } else {
      current = current ? current + ' ' + piece : piece;
    }
  });
  if (current) chunks.push(current);
  return chunks;
}

/** British English first, then Irish, then any English. A voice that runs on the device beats an online one. */
function voiceRank(voice) {
  const lang = String(voice.lang || '').replace('_', '-').toLowerCase();
  let rank;
  if (lang === 'en-gb') rank = 30;
  else if (lang === 'en-ie') rank = 20;
  else if (lang === 'en' || lang.indexOf('en-') === 0) rank = 10;
  else return -1;
  if (voice.localService) rank += 5;
  if (voice.default) rank += 2;
  return rank;
}

function pickVoice(voices) {
  let best = null;
  let bestRank = -1;
  Array.prototype.forEach.call(voices || [], voice => {
    const rank = voiceRank(voice);
    if (rank > bestRank) { best = voice; bestRank = rank; }
  });
  return best;
}

/**
 * `win` is the browser window (or a stand-in in tests).
 * speak(text, button) reads the text and marks the button as playing; pressing the same button again stops it.
 */
function createSpeaker(win) {
  const synth = win && win.speechSynthesis;
  const Utterance = win && win.SpeechSynthesisUtterance;
  const supported = Boolean(synth && Utterance);
  let playing = null;   // the button that started the current speech
  let run = 0;          // changes on every start and stop, so late events from a cancelled run are ignored
  let pieces = [];      // the pieces being spoken. Safari and Chrome can drop a piece (and its "end" event) once nothing refers to it

  function clearButton() {
    if (!playing) return;
    playing.classList.remove('speaking');
    playing.setAttribute('aria-pressed', 'false');
    playing = null;
  }

  function stop() {
    run += 1;
    clearButton();
    pieces = [];
    if (supported) synth.cancel();
  }

  function speak(text, button) {
    if (!supported) return false;
    const wasPlaying = button && button === playing;
    stop();
    if (wasPlaying || !text) return true;
    const thisRun = run;
    const voice = pickVoice(synth.getVoices());
    const chunks = splitForSpeech(text, SPEECH_CHUNK_CHARS);
    if (button) {
      playing = button;
      button.classList.add('speaking');
      button.setAttribute('aria-pressed', 'true');
    }
    chunks.forEach((chunk, position) => {
      const utterance = new Utterance(chunk);
      utterance.lang = SPEECH_LANG;
      utterance.rate = SPEECH_RATE;
      if (voice) utterance.voice = voice;
      const finished = () => { if (run === thisRun && position === chunks.length - 1) { clearButton(); pieces = []; } };
      utterance.onend = finished;
      utterance.onerror = finished;
      pieces.push(utterance);
      synth.speak(utterance);
    });
    return true;
  }

  if (supported && win.addEventListener) win.addEventListener('pagehide', stop);
  return { supported, speak, stop };
}

/*
 * The review deck: questions a student got wrong, kept on this device and asked again on later days.
 * It uses Leitner boxes: a question moves up a box each time it is answered right first time, and the
 * wait before it comes back grows (1, 3, 7, 14, then 30 days). A wrong answer sends it back to box 1.
 *
 * The functions here have no DOM and no storage access, and "today" is always passed in as a day number,
 * so they are easy to test. They change the deck object they are given.
 * The deck only exists once the student chooses to save it: no saved deck means nothing is kept.
 */

const DECK_KEY = 'vocabloom-deck1';
const DECK_WAIT_DAYS = [1, 3, 7, 14, 30];   // days until a card comes back, by box (box 1 first)
const DECK_MAX_CARDS = 300;
const DECK_SESSION_SIZE = 10;               // a review round is kept short
const DECK_TYPES = ['fill', 'short', 'choice', 'truefalse', 'match'];
const DECK_LIMITS = { prompt: 600, answer: 200, answers: 12, option: 200, options: 12, text: 300, source: 80 };

/** The student's calendar day as a whole number (local time), so "tomorrow" means tomorrow where they are. */
const dayNumber = date => Math.floor((date.getTime() - date.getTimezoneOffset() * 60000) / 86400000);

const emptyDeck = () => ({ cards: {}, mastered: 0 });

const clip = (value, max) => String(value == null ? '' : value).slice(0, max);
const clipList = (list, count, max) => (Array.isArray(list) ? list : []).slice(0, count).map(entry => clip(entry, max));

/** The same question in two worksheets (or the same worksheet twice) is one card. */
function cardId(type, prompt, answers) {
  const text = [type, prompt, (answers || []).join('|')].join('\n');
  return hash(text).toString(36) + hash('~' + text).toString(36);
}

/** Keeps the list short, but never drops the right answer from it. */
function shortList(list, rightAnswer, max) {
  const names = clipList(list, 200, DECK_LIMITS.option);
  if (names.length <= max) return names;
  const others = names.filter(name => norm(name) !== norm(rightAnswer)).slice(0, max - 1);
  return rightAnswer ? others.concat(clip(rightAnswer, DECK_LIMITS.option)) : others;
}

/**
 * A card from a worksheet question. `choices` are the drop-down answers of a matching exercise.
 * A new card comes back tomorrow.
 */
function makeCard(type, item, source, choices, today) {
  const answers = clipList(item.answers, DECK_LIMITS.answers, DECK_LIMITS.answer);
  const prompt = clip(item.prompt, DECK_LIMITS.prompt);
  return {
    id: cardId(type, prompt, answers),
    type,
    prompt,
    answers,
    options: type === 'choice' || type === 'truefalse' ? shortList(item.options, answers[0], DECK_LIMITS.options) : [],
    choices: type === 'match' ? shortList(choices, answers[0], DECK_LIMITS.options) : [],
    hint: clip(item.hint, DECK_LIMITS.text),
    explanation: clip(item.explanation, DECK_LIMITS.text),
    from: clip(source, DECK_LIMITS.source),
    box: 1,
    due: today + DECK_WAIT_DAYS[0],
    added: today,
    seen: 0,
    right: 0
  };
}

/** When the deck is full, the cards that are best known (highest box, furthest away) make room. */
function trimDeck(deck) {
  const cards = Object.keys(deck.cards).map(id => deck.cards[id]);
  if (cards.length <= DECK_MAX_CARDS) return deck;
  cards.sort((a, b) => (b.box - a.box) || (b.due - a.due) || (a.id < b.id ? -1 : 1));
  cards.slice(0, cards.length - DECK_MAX_CARDS).forEach(card => { delete deck.cards[card.id]; });
  return deck;
}

/** Adds a card, or, when the student got a known question wrong again, sends it back to box 1. */
function addCard(deck, card, today) {
  const known = deck.cards[card.id];
  if (known) {
    Object.assign(known, card, { box: 1, due: today + DECK_WAIT_DAYS[0], added: known.added, seen: known.seen, right: known.right });
  } else {
    deck.cards[card.id] = card;
  }
  return trimDeck(deck);
}

/** Cards that are ready, weakest first, then the ones that have waited longest. */
function dueCards(deck, today) {
  return Object.keys(deck.cards).map(id => deck.cards[id])
    .filter(card => card.due <= today)
    .sort((a, b) => (a.box - b.box) || (a.due - b.due) || (a.id < b.id ? -1 : 1));
}

/** Records one answer. `correct` means right at the first try. A card right in the last box is "mastered" and leaves the deck. */
function answerCard(deck, id, correct, today) {
  const card = deck.cards[id];
  if (!card) return deck;
  card.seen += 1;
  if (correct) {
    card.right += 1;
    if (card.box >= DECK_WAIT_DAYS.length) {
      delete deck.cards[id];
      deck.mastered += 1;
      return deck;
    }
    card.box += 1;
  } else {
    card.box = 1;
  }
  card.due = today + DECK_WAIT_DAYS[card.box - 1];
  return deck;
}

function deckStats(deck, today) {
  const cards = Object.keys(deck.cards).map(id => deck.cards[id]);
  const boxes = DECK_WAIT_DAYS.map((days, box) => cards.filter(card => card.box === box + 1).length);
  const waiting = cards.filter(card => card.due > today).map(card => card.due - today);
  return {
    total: cards.length,
    due: cards.length - waiting.length,
    mastered: deck.mastered,
    boxes,
    nextInDays: waiting.length ? Math.min.apply(null, waiting) : null
  };
}

/** The same shape the worksheet player uses, so the practice runner can ask deck cards too. */
function deckIndex(cards) {
  const items = {};
  const matchOptions = {};
  cards.forEach((card, position) => {
    items[card.id] = {
      id: card.id,
      scored: true,
      sectionIndex: position,
      itemIndex: 0,
      section: { type: card.type, title: card.from || 'Review' },
      item: { prompt: card.prompt, answers: card.answers, options: card.options, hint: card.hint, explanation: card.explanation }
    };
    if (card.type === 'match') matchOptions[position] = card.choices;
  });
  return { items, matchOptions };
}

/* ---------- reading back what was stored ---------- */

const wholeNumber = (value, fallback, min) => (Number.isFinite(value) && value >= min ? Math.floor(value) : fallback);

/** Anything read from storage is checked: a damaged or edited deck must never break the page. */
function cleanCard(raw, today) {
  if (!raw || typeof raw !== 'object' || DECK_TYPES.indexOf(raw.type) === -1) return null;
  const answers = clipList(raw.answers, DECK_LIMITS.answers, DECK_LIMITS.answer).filter(answer => answer.trim());
  const prompt = clip(raw.prompt, DECK_LIMITS.prompt);
  if (!prompt || !answers.length) return null;
  let options = clipList(raw.options, DECK_LIMITS.options, DECK_LIMITS.option);
  let choices = clipList(raw.choices, DECK_LIMITS.options, DECK_LIMITS.option);
  if (raw.type === 'truefalse' && !options.length) options = ['True', 'False'];
  if (raw.type === 'choice' && options.length < 2) return null;
  if (raw.type === 'match' && choices.length < 2) return null;
  const ensureAnswer = list => (list.some(entry => norm(entry) === norm(answers[0])) ? list : list.concat(answers[0]));
  if (raw.type === 'choice' || raw.type === 'truefalse') options = ensureAnswer(options);
  if (raw.type === 'match') choices = ensureAnswer(choices);
  const id = typeof raw.id === 'string' && /^[a-z0-9]{2,24}$/.test(raw.id) ? raw.id : cardId(raw.type, prompt, answers);
  return {
    id,
    type: raw.type,
    prompt,
    answers,
    options: raw.type === 'choice' || raw.type === 'truefalse' ? options : [],
    choices: raw.type === 'match' ? choices : [],
    hint: clip(raw.hint, DECK_LIMITS.text),
    explanation: clip(raw.explanation, DECK_LIMITS.text),
    from: clip(raw.from, DECK_LIMITS.source),
    box: Math.min(DECK_WAIT_DAYS.length, wholeNumber(raw.box, 1, 1)),
    due: wholeNumber(raw.due, today, 0),
    added: wholeNumber(raw.added, today, 0),
    seen: wholeNumber(raw.seen, 0, 0),
    right: wholeNumber(raw.right, 0, 0)
  };
}

function sanitiseDeck(raw, today) {
  const deck = emptyDeck();
  if (!raw || typeof raw !== 'object' || !raw.cards || typeof raw.cards !== 'object') return deck;
  deck.mastered = wholeNumber(raw.mastered, 0, 0);
  Object.keys(raw.cards).forEach(key => {
    const card = cleanCard(raw.cards[key], today);
    if (card) deck.cards[card.id] = card;
  });
  return trimDeck(deck);
}

/* ---------- storage: the key only exists once the student has chosen to keep a deck ---------- */

/** Returns the saved deck, or null when the student has not chosen to keep one. */
function loadDeck(today, storage) {
  storage = storage || localStorage;
  let text = null;
  try { text = storage.getItem(DECK_KEY); } catch (error) { return null; }
  if (text === null) return null;
  try { return sanitiseDeck(JSON.parse(text), today); } catch (error) { return emptyDeck(); }
}

/** Returns false when the browser would not store it (private mode or full storage). */
function saveDeck(deck, storage) {
  try { (storage || localStorage).setItem(DECK_KEY, JSON.stringify(deck)); return true; } catch (error) { return false; }
}

function deleteDeck(storage) {
  try { (storage || localStorage).removeItem(DECK_KEY); } catch (error) { /* nothing to delete */ }
}

/*
 * What Vocabloom keeps on a student's device besides their answers and the review deck:
 * the worksheets they opened recently (a title and a link each), so the app can offer them again
 * when it is opened from the home screen. Everything stays in this browser's local storage.
 */

const RECENT_KEY = 'vocabloom-recent1';
const RECENT_MAX = 8;
const RECENT_MAX_LINK_CHARS = 20000;
const LOCAL_KEY_PREFIX = 'vocabloom';   // student answers (vocabloom3:...), the deck and the recent list

/** Only worksheet links are ever kept or used as a link target: no other kind of address can get in. */
const WORKSHEET_LINK = /^#(?:[sj]=[\w-]+|w=[A-Za-z0-9_-]{12})$/;

/** Newest first, one entry per link, at most RECENT_MAX. Returns a new list. */
function addRecent(list, title, link, now) {
  if (!WORKSHEET_LINK.test(link) || link.length > RECENT_MAX_LINK_CHARS) return list.slice();
  const entry = { title: String(title || 'Worksheet').slice(0, 120), link, at: now };
  return [entry].concat(list.filter(known => known.link !== link)).slice(0, RECENT_MAX);
}

function cleanRecent(raw) {
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(entry => entry && typeof entry.link === 'string' && WORKSHEET_LINK.test(entry.link) && entry.link.length <= RECENT_MAX_LINK_CHARS)
    .map(entry => ({ title: String(entry.title || 'Worksheet').slice(0, 120), link: entry.link, at: Number.isFinite(entry.at) ? entry.at : 0 }))
    .slice(0, RECENT_MAX);
}

function loadRecent(storage) {
  try { return cleanRecent(JSON.parse((storage || localStorage).getItem(RECENT_KEY) || '[]')); } catch (error) { return []; }
}

function rememberRecent(title, link, now, storage) {
  try { (storage || localStorage).setItem(RECENT_KEY, JSON.stringify(addRecent(loadRecent(storage), title, link, now))); } catch (error) { /* storage full or blocked */ }
}

/** "Clear everything on this device": answers, deck and recent list. Returns how many items were removed. */
function clearLocalData(storage) {
  storage = storage || localStorage;
  const keys = [];
  try {
    for (let i = 0; i < storage.length; i++) {
      const key = storage.key(i);
      if (key && key.indexOf(LOCAL_KEY_PREFIX) === 0) keys.push(key);
    }
    keys.forEach(key => storage.removeItem(key));
  } catch (error) { /* storage blocked: nothing was kept */ }
  return keys.length;
}

/** "Opened today", "Opened yesterday", "Opened 3 days ago". */
function openedText(at, now) {
  if (!at) return '';
  const days = dayNumber(new Date(now)) - dayNumber(new Date(at));
  if (days < 0) return '';
  if (days === 0) return 'Opened today';
  if (days === 1) return 'Opened yesterday';
  return 'Opened ' + days + ' days ago';
}

/*
 * Working offline. A service worker keeps the app and every worksheet a student has opened,
 * and a bar at the bottom of the screen says so when the phone loses its connection.
 */

const OFFLINE_MESSAGES = {
  student: 'You are offline. Your answers are still saved on this device.',
  teacher: 'You are offline. Converting a PDF needs an internet connection.'
};

let offlineKind = 'student';
let offlineBar = null;

/** Service workers need a secure page (https), and localhost counts for testing. */
function canUseServiceWorker() {
  return 'serviceWorker' in navigator
    && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
}

function registerServiceWorker() {
  if (!canUseServiceWorker()) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => { /* the app works without it */ });
  });
}

function updateOfflineBar() {
  if (!offlineBar) return;
  offlineBar.textContent = OFFLINE_MESSAGES[offlineKind];
  offlineBar.hidden = navigator.onLine !== false;
}

function watchConnection() {
  offlineBar = document.createElement('div');
  offlineBar.className = 'net';
  offlineBar.setAttribute('role', 'status');
  document.body.appendChild(offlineBar);
  window.addEventListener('online', updateOfflineBar);
  window.addEventListener('offline', updateOfflineBar);
  updateOfflineBar();
}

/** kind: 'student' or 'teacher' */
function setOfflineMessage(kind) {
  offlineKind = kind;
  updateOfflineBar();
}

/*
 * What kind of device this is, used only to show the right tip. Nothing here is stored or sent anywhere.
 * `win` is the browser window (or a stand-in in tests).
 */

/** iPhone, iPod and iPad. Since iPadOS 13 an iPad says it is a Mac, but it is the one "Mac" with a touch screen. */
function isAppleTouchDevice(win) {
  const nav = (win && win.navigator) || {};
  const agent = String(nav.userAgent || '');
  return /iPhone|iPad|iPod/.test(agent) || (/Macintosh/.test(agent) && Number(nav.maxTouchPoints) > 1);
}

/** True when the page was opened from the Home Screen icon and not from a browser tab. */
function isInstalledApp(win) {
  const nav = (win && win.navigator) || {};
  if (nav.standalone === true) return true;
  return Boolean(win && win.matchMedia && win.matchMedia('(display-mode: standalone)').matches);
}

/** iPhone and iPad have no "install" button, so a student has to be told about Share, then Add to Home Screen. */
const needsHomeScreenHint = win => isAppleTouchDevice(win) && !isInstalledApp(win);

const HOME_SCREEN_HINT = 'Tip: tap the Share button, then Add to Home Screen. Vocabloom then opens like an app, and Safari is less likely to clear your review deck if you do not visit for a while.';

/*
 * Share links: the whole worksheet lives in the URL hash (compressed), so no database is needed.
 * The part after "#" is never sent to the server when a student opens the link.
 */

const MAX_LINK_CHARS = 400000;
const MAX_UNPACKED_BYTES = 2 * 1024 * 1024;

const base64url = {
  encode(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  decode(text) {
    text = text.replace(/-/g, '+').replace(/_/g, '/');
    while (text.length % 4) text += '=';
    const binary = atob(text);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
};

/** Returns "s=..." (compressed) or "j=..." (plain, when the browser cannot compress). */
async function pack(worksheet) {
  const bytes = new TextEncoder().encode(slimJSON(worksheet));
  if (typeof CompressionStream !== 'undefined') {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 's=' + base64url.encode(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  return 'j=' + base64url.encode(bytes);
}

/** Reads a stream but gives up as soon as it grows past `max` bytes (protects against zip bombs). */
async function readLimited(stream, max) {
  const reader = stream.getReader();
  const parts = [];
  let size = 0;
  for (;;) {
    const chunk = await reader.read();
    if (chunk.done) break;
    size += chunk.value.length;
    if (size > max) {
      await reader.cancel();
      throw new Error('Worksheet too large');
    }
    parts.push(chunk.value);
  }
  const out = new Uint8Array(size);
  let offset = 0;
  parts.forEach(part => { out.set(part, offset); offset += part.length; });
  return out;
}

/** Turns a URL hash back into a worksheet, or returns null when it is not a worksheet link. */
async function unpack(hashText) {
  if (String(hashText).length > MAX_LINK_CHARS) return null;
  const match = String(hashText).match(/^#?([sj])=([\w-]+)$/);
  if (!match) return null;
  let bytes = base64url.decode(match[2]);
  if (match[1] === 's') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = await readLimited(stream, MAX_UNPACKED_BYTES);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/*
 * QR code generator, written for Vocabloom (no libraries).
 * Byte mode, error correction level M, versions 1 to 10: enough for a link of up to 213 characters.
 * Pure functions: qrMatrix(text) gives a square list of rows (true = dark module), qrSvg(matrix) draws it.
 * Layout and numbers follow ISO/IEC 18004; the tests check it against a known Reed-Solomon vector,
 * and the output was decoded with an independent QR reader.
 */

const QR_MAX_VERSION = 10;
const QR_ECC_PER_BLOCK = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26];  // level M, versions 1..10
const QR_BLOCKS = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
const QR_ALIGNMENT = [[], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];
const QR_FORMAT_LEVEL_M = 0;      // the two format bits that mean "level M"
const QR_DARK = '#0B1D24';

/* ---------- Reed-Solomon error correction over GF(256) ---------- */

const GF_EXP = new Array(512);
const GF_LOG = new Array(256);
(function fillGaloisTables() {
  let value = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = value;
    GF_LOG[value] = i;
    value <<= 1;
    if (value & 0x100) value ^= 0x11D;
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();

const gfMultiply = (a, b) => (a && b ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0);

/** The generator polynomial of the given degree: (x - a^0)(x - a^1)... with the leading 1 first. */
function rsGenerator(degree) {
  let poly = [1];
  for (let i = 0; i < degree; i++) {
    const next = new Array(poly.length + 1).fill(0);
    poly.forEach((coefficient, j) => {
      next[j] ^= coefficient;
      next[j + 1] ^= gfMultiply(coefficient, GF_EXP[i]);
    });
    poly = next;
  }
  return poly;
}

/** The `ecLength` error correction codewords for a block of data codewords. */
function rsRemainder(data, ecLength) {
  const generator = rsGenerator(ecLength);
  const work = data.concat(new Array(ecLength).fill(0));
  for (let i = 0; i < data.length; i++) {
    const factor = work[i];
    if (!factor) continue;
    for (let j = 1; j < generator.length; j++) work[i + j] ^= gfMultiply(generator[j], factor);
  }
  return work.slice(data.length);
}

/* ---------- sizes ---------- */

/** Bits that can hold data or error correction in a version (everything except the fixed patterns). */
function qrRawModules(version) {
  let modules = (16 * version + 128) * version + 64;
  if (version >= 2) {
    const align = Math.floor(version / 7) + 2;
    modules -= (25 * align - 10) * align - 55;
    if (version >= 7) modules -= 36;
  }
  return modules;
}

const qrDataCodewords = version => Math.floor(qrRawModules(version) / 8) - QR_ECC_PER_BLOCK[version - 1] * QR_BLOCKS[version - 1];
const qrCountBits = version => (version < 10 ? 8 : 16);

function qrVersionFor(byteLength) {
  for (let version = 1; version <= QR_MAX_VERSION; version++) {
    if (4 + qrCountBits(version) + 8 * byteLength <= qrDataCodewords(version) * 8) return version;
  }
  throw new Error('Too long for a QR code');
}

/* ---------- data codewords ---------- */

function qrDataBits(bytes, version) {
  const bits = [];
  const push = (value, count) => { for (let i = count - 1; i >= 0; i--) bits.push((value >>> i) & 1); };
  push(0b0100, 4);                       // byte mode
  push(bytes.length, qrCountBits(version));
  bytes.forEach(byte => push(byte, 8));
  const capacity = qrDataCodewords(version) * 8;
  push(0, Math.min(4, capacity - bits.length));   // terminator
  while (bits.length % 8) bits.push(0);
  const codewords = [];
  for (let i = 0; i < bits.length; i += 8) codewords.push(parseInt(bits.slice(i, i + 8).join(''), 2));
  for (let pad = 0xEC; codewords.length < qrDataCodewords(version); pad ^= 0xEC ^ 0x11) codewords.push(pad);
  return codewords;
}

/** Splits the data into blocks, adds error correction to each, and interleaves them. */
function qrInterleave(data, version) {
  const blockCount = QR_BLOCKS[version - 1];
  const ecLength = QR_ECC_PER_BLOCK[version - 1];
  const rawCodewords = Math.floor(qrRawModules(version) / 8);
  const shortBlocks = blockCount - (rawCodewords % blockCount);
  const shortLength = Math.floor(rawCodewords / blockCount);
  const dataBlocks = [];
  let start = 0;
  for (let i = 0; i < blockCount; i++) {
    const length = shortLength - ecLength + (i < shortBlocks ? 0 : 1);
    dataBlocks.push(data.slice(start, start + length));
    start += length;
  }
  const ecBlocks = dataBlocks.map(block => rsRemainder(block, ecLength));
  const out = [];
  for (let i = 0; i < shortLength - ecLength + 1; i++) dataBlocks.forEach(block => { if (i < block.length) out.push(block[i]); });
  for (let i = 0; i < ecLength; i++) ecBlocks.forEach(block => out.push(block[i]));
  return out;
}

/* ---------- the grid ---------- */

const bitOf = (value, index) => (value >>> index) & 1;

const QR_MASKS = [
  (x, y) => (x + y) % 2 === 0,
  (x, y) => y % 2 === 0,
  (x, y) => x % 3 === 0,
  (x, y) => (x + y) % 3 === 0,
  (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
  (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
  (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
  (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0
];

function qrGrid(version, codewords) {
  const size = 17 + 4 * version;
  const dark = Array.from({ length: size }, () => new Array(size).fill(false));
  const fixed = Array.from({ length: size }, () => new Array(size).fill(false));
  const set = (x, y, value) => { dark[y][x] = !!value; fixed[y][x] = true; };

  // Timing lines, finder patterns (with their white borders) and alignment patterns.
  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([cx, cy]) => {
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy, ring = Math.max(Math.abs(dx), Math.abs(dy));
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, ring !== 2 && ring !== 4);
      }
    }
  });
  const places = QR_ALIGNMENT[version - 1];
  places.forEach((cy, i) => places.forEach((cx, j) => {
    const onFinder = (i === 0 && j === 0) || (i === 0 && j === places.length - 1) || (i === places.length - 1 && j === 0);
    if (onFinder) return;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));

  // Version information (versions 7 and up).
  if (version >= 7) {
    let rest = version;
    for (let i = 0; i < 12; i++) rest = (rest << 1) ^ ((rest >>> 11) * 0x1F25);
    const bits = (version << 12) | rest;
    for (let i = 0; i < 18; i++) {
      const a = size - 11 + (i % 3), b = Math.floor(i / 3);
      set(a, b, bitOf(bits, i));
      set(b, a, bitOf(bits, i));
    }
  }

  /** Writes the 15 format bits (error level + mask), twice, and the always-dark module. */
  function drawFormat(mask) {
    const data = (QR_FORMAT_LEVEL_M << 3) | mask;
    let rest = data;
    for (let i = 0; i < 10; i++) rest = (rest << 1) ^ ((rest >>> 9) * 0x537);
    const bits = ((data << 10) | rest) ^ 0x5412;
    for (let i = 0; i <= 5; i++) set(8, i, bitOf(bits, i));
    set(8, 7, bitOf(bits, 6));
    set(8, 8, bitOf(bits, 7));
    set(7, 8, bitOf(bits, 8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bitOf(bits, i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bitOf(bits, i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, bitOf(bits, i));
    set(8, size - 8, true);
  }
  drawFormat(0);   // reserves the format areas so the data skips them

  // Data bits, in the zigzag order of the standard.
  let bit = 0;
  const totalBits = codewords.length * 8;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let step = 0; step < size; step++) {
      for (let side = 0; side < 2; side++) {
        const x = right - side;
        const y = ((right + 1) & 2) === 0 ? size - 1 - step : step;
        if (!fixed[y][x] && bit < totalBits) {
          dark[y][x] = bitOf(codewords[bit >>> 3], 7 - (bit & 7)) === 1;
          bit++;
        }
      }
    }
  }

  const applyMask = mask => {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fixed[y][x] && QR_MASKS[mask](x, y)) dark[y][x] = !dark[y][x];
  };

  // Try all eight masks and keep the one the standard scores best (fewest hard-to-scan patterns).
  let best = { mask: 0, penalty: Infinity };
  for (let mask = 0; mask < 8; mask++) {
    applyMask(mask);
    drawFormat(mask);
    const penalty = qrPenalty(dark);
    if (penalty < best.penalty) best = { mask, penalty };
    applyMask(mask);
  }
  applyMask(best.mask);
  drawFormat(best.mask);
  return dark;
}

/** The standard's four penalty rules: long runs, 2x2 blocks, finder-like patterns, and dark/light balance. */
function qrPenalty(grid) {
  const size = grid.length;
  let score = 0;
  const lines = [];
  for (let i = 0; i < size; i++) {
    lines.push(grid[i].slice());
    lines.push(grid.map(row => row[i]));
  }
  lines.forEach(line => {
    let run = 1;
    for (let i = 1; i <= size; i++) {
      if (i < size && line[i] === line[i - 1]) run++;
      else { if (run >= 5) score += 3 + (run - 5); run = 1; }
    }
    // 1:1:3:1:1 with four light modules on one side (looks like a finder pattern).
    for (let i = 0; i + 11 <= size; i++) {
      const pattern = line.slice(i, i + 11).map(Number).join('');
      if (pattern === '10111010000' || pattern === '00001011101') score += 40;
    }
  });
  for (let y = 0; y + 1 < size; y++) {
    for (let x = 0; x + 1 < size; x++) {
      const colour = grid[y][x];
      if (grid[y][x + 1] === colour && grid[y + 1][x] === colour && grid[y + 1][x + 1] === colour) score += 3;
    }
  }
  const darkCount = grid.reduce((sum, row) => sum + row.filter(Boolean).length, 0);
  score += (Math.ceil(Math.abs(darkCount * 20 - size * size * 10) / (size * size)) - 1) * 10;
  return score;
}

/** The QR code for a text, as rows of booleans. Throws when the text is too long for versions 1 to 10. */
function qrMatrix(text) {
  const bytes = Array.from(new TextEncoder().encode(String(text)));
  const version = qrVersionFor(bytes.length);
  return qrGrid(version, qrInterleave(qrDataBits(bytes, version), version));
}

/* ---------- drawing ---------- */

const QR_QUIET_ZONE = 4;   // the standard asks for four light modules all around

/** A self-contained SVG: dark modules as one path, on a white square. */
function qrSvg(matrix) {
  const size = matrix.length;
  const total = size + QR_QUIET_ZONE * 2;
  let path = '';
  matrix.forEach((row, y) => {
    for (let x = 0; x < size;) {
      if (!row[x]) { x++; continue; }
      let end = x;
      while (end < size && row[end]) end++;
      path += 'M' + (x + QR_QUIET_ZONE) + ' ' + (y + QR_QUIET_ZONE) + 'h' + (end - x) + 'v1h-' + (end - x) + 'z';
      x = end;
    }
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges" role="img" aria-label="QR code">'
    + '<rect width="' + total + '" height="' + total + '" fill="#fff"/><path d="' + path + '" fill="' + QR_DARK + '"/></svg>';
}

/** Draws the code on a canvas (white background, quiet zone included) at roughly `pixels` wide. */
function qrDrawCanvas(canvas, matrix, pixels) {
  const total = matrix.length + QR_QUIET_ZONE * 2;
  const scale = Math.max(1, Math.ceil(pixels / total));
  canvas.width = canvas.height = total * scale;
  const context = canvas.getContext('2d');
  context.fillStyle = '#fff';
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = QR_DARK;
  matrix.forEach((row, y) => row.forEach((on, x) => {
    if (on) context.fillRect((x + QR_QUIET_ZONE) * scale, (y + QR_QUIET_ZONE) * scale, scale, scale);
  }));
}

/*
 * Download a worksheet as one self-contained .html file.
 * The page re-reads its own source (captured before anything is drawn) and swaps in the worksheet data.
 */

// The app's install links are left out of a downloaded file: it is not part of the website.
const PAGE_SOURCE = ('<!DOCTYPE html>\n' + document.documentElement.outerHTML).replace(/<link rel="(?:manifest|apple-touch-icon)"[^>]*>\n?/g, '');
const DATA_TAG_OPEN = '<script id="ws-data" type="application/json">';
const SCRIPT_CLOSE = '</' + 'script>';

function buildStandalonePage(worksheet) {
  const start = PAGE_SOURCE.indexOf(DATA_TAG_OPEN);
  const end = PAGE_SOURCE.indexOf(SCRIPT_CLOSE, start);
  // "<" is escaped so the data can never close the script tag early.
  const json = slimJSON(worksheet).replace(/</g, '\\u003c');
  return PAGE_SOURCE.slice(0, start + DATA_TAG_OPEN.length) + json + PAGE_SOURCE.slice(end);
}

function downloadTextFile(name, text) {
  downloadBlob(name, new Blob([text], { type: 'text/html' }));
}

function downloadBlob(name, blob) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 3000);
}

/*
 * What a student has done so far. It lives only in that student's browser (local storage):
 * nothing is sent to a server.
 */

const STORAGE_PREFIX = 'vocabloom3:';

function freshStudentState() {
  return {
    name: '',
    values: {},          // id -> what the student typed or chose
    checked: {},         // id -> true once "Check" was pressed (typed answers)
    revealed: {},        // id -> true once the student asked to see the answer
    hintTaps: {},        // id -> how many times the hint button was pressed
    wrongAttempts: {},   // id -> number of different wrong answers
    everWrong: {},       // id -> true once a wrong answer was given
    lastWrongAnswer: {}, // id -> the last wrong answer, to avoid counting the same one twice
    practiceSkipped: false,
    deckDismissed: false   // "No thanks" to keeping the mistakes in the review deck
  };
}

/** The same worksheet always maps to the same key, so a student can come back later. */
const storageKey = worksheet => STORAGE_PREFIX + hash(slimJSON(worksheet));

function loadStudentState(key) {
  try {
    const saved = JSON.parse(localStorage.getItem(key) || 'null');
    return Object.assign(freshStudentState(), saved || {});
  } catch (error) {
    return freshStudentState();
  }
}

function saveStudentState(key, state) {
  try { localStorage.setItem(key, JSON.stringify(state)); } catch (error) { /* storage full or blocked: keep going */ }
}

/* A flat index of every question in a worksheet, so the player can find one by its id. */

const itemId = (sectionIndex, itemIndex) => 's' + sectionIndex + 'i' + itemIndex;

/** The drop-down choices for a matching exercise: every right-hand side once, in a stable shuffle. */
function matchChoices(section, random) {
  const seen = {};
  const rightSides = section.items
    .map(item => item.answers[0] || item.right)
    .filter(text => text && !seen[text] && (seen[text] = true));
  return shuffle(rightSides, random);
}

function buildItemIndex(worksheet) {
  const random = seededRandom(hash(worksheet.title + '|' + worksheet.sections.length));
  const items = {};
  const matchOptions = {};

  worksheet.sections.forEach((section, sectionIndex) => {
    if (section.type === 'match') matchOptions[sectionIndex] = matchChoices(section, random);
    section.items.forEach((item, itemIndex) => {
      const id = itemId(sectionIndex, itemIndex);
      items[id] = { id, item, section, sectionIndex, itemIndex, scored: isScored(section, item) };
    });
  });

  const scoredIds = Object.keys(items).filter(id => items[id].scored);
  return { items, matchOptions, scoredIds };
}

/* HTML for the student worksheet. Everything dynamic is escaped with esc(). */

/* An answer field: no suggestions or auto-correction (it would change the answer), and the iPhone's return key reads "done"
   because pressing it checks the answer and closes the keyboard. */
const NO_AUTOFILL = 'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"';

const tipHtml = (icon, text) => (text ? '<div class="tip">' + icon + ' ' + esc(text) + '</div>' : '');

/** Wide enough for the longest accepted answer, but never absurdly narrow or wide. */
function blankWidth(item, blankIndex) {
  const answers = alts(item.answers[blankIndex] || '');
  const longest = answers.length ? Math.max.apply(null, answers.map(answer => answer.length)) : 8;
  return Math.min(20, Math.max(7, longest + 2));
}

/** A sentence with an input in place of each "___". `fieldAttrs(k)` says how to tag blank k. */
function fillPromptHtml(item, fieldAttrs) {
  const parts = item.prompt.split('___');
  const lastIndex = parts.length - 1;
  return parts.map((text, k) => esc(text) + (k < lastIndex
    ? '<input type="text" class="blk" style="width:' + blankWidth(item, k) + 'ch" ' + fieldAttrs(k) + ' ' + NO_AUTOFILL + ' aria-label="blank ' + (k + 1) + '">'
    : '')).join('');
}

const shortInputHtml = (attrs, placeholder) =>
  '<input type="text" ' + attrs + ' ' + NO_AUTOFILL + ' placeholder="' + placeholder + '" aria-label="Your answer">';

/** Short options (True / False, single words) are drawn side by side on wide screens. */
const SHORT_OPTION_CHARS = 24;

const choiceButtonsHtml = (item, attrs) =>
  '<div class="opts' + (item.options.every(option => option.length <= SHORT_OPTION_CHARS) ? ' short' : '') + '">' + item.options.map(option => '<button class="opt" ' + attrs + ' data-v="' + esc(option) + '">' + esc(option) + '</button>').join('') + '</div>';

const matchSelectHtml = (options, attrs) =>
  '<select ' + attrs + ' aria-label="Choose the match"><option value="">Choose&hellip;</option>' + options.map(option => '<option>' + esc(option) + '</option>').join('') + '</select>';

/** The round "listen" button. It floats to the right of the text it reads. */
const listenButtonHtml = (attrs, label) =>
  '<button class="say" ' + attrs + ' aria-label="' + label + '" aria-pressed="false">&#128266;</button>';

/* ---------- one question card ---------- */

/** `view.listen` is true when the browser can read text aloud. */
function questionCardHtml(entry, matchOptions, view) {
  const { id, item, section, itemIndex, scored } = entry;
  const say = view.listen ? listenButtonHtml('data-act="say" data-id="' + id + '"', 'Listen to the question') : '';
  const number = '<b>' + (itemIndex + 1) + '.</b> ';
  const prompt = '<div class="q">' + say + number + esc(item.prompt) + '</div>';
  const feedback = '<div class="msg" id="m-' + id + '" aria-live="polite"></div>';
  const buttons = scored
    ? '<div class="row" style="margin-top:6px"><button data-act="check" data-id="' + id + '">&#10003; Check</button><button class="sec" data-act="hint" data-id="' + id + '" aria-label="Hint">&#128161;</button></div>'
    : '';
  const card = inner => '<div class="card" id="w-' + id + '">' + inner + '</div>';

  switch (section.type) {
    case 'fill':
      return card('<div class="q">' + say + number + fillPromptHtml(item, k => 'data-id="' + id + '" data-k="' + k + '"') + '</div>' + buttons + feedback);
    case 'short':
      return card(prompt + shortInputHtml('data-id="' + id + '" data-k="0"', scored ? 'Type your answer' : 'Your answer') + buttons + feedback);
    case 'open':
      return '<div class="card">' + prompt + '<textarea data-id="' + id + '" data-k="0" placeholder="Write your answer here..." autocapitalize="sentences" aria-label="Your answer"></textarea></div>';
    case 'choice':
    case 'truefalse':
      return card(prompt + choiceButtonsHtml(item, 'data-act="pick" data-id="' + id + '"') + feedback);
    case 'match':
      return card(prompt + matchSelectHtml(matchOptions[entry.sectionIndex], 'data-id="' + id + '"') + feedback);
    default:
      return '';
  }
}

/* ---------- sections and the whole page ---------- */

/** With read-aloud, each word in the bank can be tapped to hear it. */
function wordChipHtml(word, listen) {
  const speak = listen ? ' data-act="say-word" role="button" tabindex="0" aria-pressed="false" aria-label="Listen to ' + esc(word) + '"' : '';
  return '<span class="chip" data-w="' + esc(norm(word)) + '"' + speak + '>' + esc(word) + '</span>';
}

function sectionHtml(section, sectionIndex, index, view) {
  const wordBank = section.wordBank.length
    ? '<details class="bank"><summary>Word bank (' + section.wordBank.length + ')</summary>'
      + (view.listen ? '<p class="sub" style="margin:8px 0 0">Tap a word to hear it.</p>' : '')
      + '<div class="chips">' + section.wordBank.map(word => wordChipHtml(word, view.listen)).join('') + '</div></details>'
    : '';
  const passageSay = view.listen ? listenButtonHtml('data-act="say-passage" data-s="' + sectionIndex + '"', 'Listen to the text') : '';
  const cards = section.items.map((item, itemIndex) => questionCardHtml(index.items[itemId(sectionIndex, itemIndex)], index.matchOptions, view)).join('');
  return '<div class="pl" id="sec-' + sectionIndex + '"><h3>' + esc(section.title || ('Exercise ' + (sectionIndex + 1))) + '</h3>'
    + (section.instructions ? '<p class="sub">' + esc(section.instructions) + '</p>' : '')
    + (section.passage ? '<div class="passage">' + passageSay + esc(section.passage) + '</div>' : '')
    + wordBank + cards + '</div>';
}

/** `view` = { listen, home }: read-aloud is available / the student's home page can be linked to. */
function playerHtml(worksheet, index, view) {
  const hasScore = index.scoredIds.length > 0;
  const privacyLink = location.protocol === 'file:' ? '' : ' &middot; <a href="privacy.html">Privacy</a>';
  const homeLink = view.home ? ' &middot; <a href="#review">My review deck</a>' : '';
  return '<div class="hero"><div class="brand-mini">' + LOGO + '<span>Vocabloom</span></div><h1>' + esc(worksheet.title) + '</h1></div>'
    + '<div class="namebar"><input id="sname" type="text" placeholder="Your name" autocomplete="name" aria-label="Your name"><span class="date">' + new Date().toLocaleDateString('en-GB') + '</span></div>'
    + (hasScore ? '<div class="bar"><div class="t"><span>Score</span><span id="score"></span></div><div class="prog"><i id="pb"></i></div></div>' : '<div style="height:6px"></div>')
    + worksheet.sections.map((section, sectionIndex) => sectionHtml(section, sectionIndex, index, view)).join('')
    + '<div class="pl"><div id="mist"></div><div id="prac"></div><div id="deck"></div>'
    + '<div class="final" id="final" aria-live="polite"><div class="big" id="fscore"></div><div id="fdetail" style="margin:4px 0;font-size:14px"></div><div id="fmsg"></div></div>'
    + '<div class="actions"><button class="sec" data-act="reset">Start over</button>' + (hasScore ? '<button data-act="all">Check all</button>' : '') + '</div>'
    + '<p class="foot">Made with Vocabloom' + privacyLink + homeLink + '<br>Hints and explanations may be written with the help of AI.</p></div>';
}

/*
 * A one-question-at-a-time runner. It is used twice:
 *   - "Practise your mistakes" on a worksheet: optional, and it never changes the score;
 *   - the review deck (deck-panel.js): the same questions, kept on this device, asked again on later days.
 * The student can skip or stop at any moment.
 *
 * ctx = {
 *   root, panel, prefix,    where to draw, the container's selector, and the prefix of its action names and ids
 *   index,                  the question index (or a function that builds it when a run starts)
 *   ids(),                  the question ids to ask, in order
 *   hintFor(id),            hint text for an id
 *   idleHtml?(count),       what to show before a run (default: the "Practise your mistakes?" offer)
 *   isClosed?(),            true when the student already said "no thanks"
 *   onClose?(),             the student pressed the close / skip button
 *   afterClose?,            mode to go to after that: 'closed' (default) or 'idle'
 *   onResult?(id, right),   a question was settled: `right` is true only when it was right at the first try
 *   speak?(text, button),   read-aloud; leave out to hide the listen button
 *   copy?                   texts, see PRACTICE_COPY; copy.done receives { asked, right, firstTime }
 * }
 */

const MAX_PRACTICE_TRIES = 3;

const PRACTICE_COPY = {
  offerTitle: 'Practise your mistakes?',
  offer: count => 'Optional. Try the ' + count + ' question' + (count === 1 ? '' : 's') + ' you got wrong again, one at a time. It will not change your score.',
  start: 'Practise now',
  skip: 'No thanks, skip',
  running: 'Practice',
  doneTitle: 'Practice complete',
  done: result => result.right + ' of ' + result.asked + ' fixed. Well done for going back over them!',
  close: 'Close'
};

function createPractice(ctx) {
  const { root, prefix } = ctx;
  const copy = Object.assign({}, PRACTICE_COPY, ctx.copy || {});
  const fieldAttr = 'data-' + prefix + 'k';
  const act = name => prefix + '-' + name;
  const run = { mode: ctx.isClosed && ctx.isClosed() ? 'closed' : 'idle', ids: [], index: null, position: 0, fixed: 0, firstTime: 0, tries: 0, resolved: false, picked: '' };
  const result = () => ({ asked: run.ids.length, right: run.fixed, firstTime: run.firstTime });

  const panel = () => $(ctx.panel, root);
  const message = () => $('#' + prefix + 'msg', root);
  const currentEntry = () => run.index.items[run.ids[run.position]];
  const buildIndex = () => (typeof ctx.index === 'function' ? ctx.index() : ctx.index);

  /* ---------- drawing ---------- */

  function offerHtml(count) {
    return '<div class="card prac"><h3 style="margin:0 0 4px">' + esc(copy.offerTitle) + '</h3>'
      + '<p class="sub" style="margin:0 0 10px">' + esc(copy.offer(count)) + '</p>'
      + '<div class="actions" style="margin:0"><button data-act="' + act('start') + '">' + esc(copy.start) + '</button><button class="sec" data-act="' + act('skip') + '">' + esc(copy.skip) + '</button></div></div>';
  }

  function doneHtml() {
    return '<div class="card prac ok"><h3 style="margin:0 0 4px">' + esc(copy.doneTitle) + '</h3>'
      + '<p style="margin:0 0 10px">' + esc(copy.done(result())) + '</p>'
      + '<div class="actions" style="margin:0"><button class="sec" data-act="' + act('skip') + '">' + esc(copy.close) + '</button></div></div>';
  }

  function questionHtml(entry) {
    const { item, section } = entry;
    const say = ctx.speak ? listenButtonHtml('data-act="' + act('say') + '"', 'Listen to the question') : '';
    const prompt = '<div class="q">' + say + esc(item.prompt) + '</div>';
    switch (section.type) {
      case 'fill': return '<div class="q">' + say + fillPromptHtml(item, k => fieldAttr + '="' + k + '"') + '</div>';
      case 'short': return prompt + shortInputHtml(fieldAttr + '="0"', 'Type your answer');
      case 'choice':
      case 'truefalse': return prompt + choiceButtonsHtml(item, 'data-act="' + act('pick') + '"');
      case 'match': return prompt + matchSelectHtml(run.index.matchOptions[entry.sectionIndex], fieldAttr + '="0"');
      default: return '';
    }
  }

  function runningHtml() {
    const entry = currentEntry();
    const where = entry.section.title || ('Exercise ' + (entry.sectionIndex + 1));
    return '<div class="card prac">'
      + '<div class="sub" style="margin:0 0 6px">' + esc(copy.running) + ' &middot; question ' + (run.position + 1) + ' of ' + run.ids.length + ' &middot; ' + esc(where) + '</div>'
      + questionHtml(entry) + '<div class="msg" id="' + prefix + 'msg" aria-live="polite"></div>'
      + '<div class="row" style="margin-top:8px"><button data-act="' + act('check') + '" id="' + prefix + 'chk">&#10003; Check</button><button class="sec" data-act="' + act('hint') + '">&#128161; Hint</button><button data-act="' + act('next') + '" id="' + prefix + 'next" style="display:none">Next &rarr;</button></div>'
      + '<div class="actions" style="margin:10px 0 0"><button class="ghost" data-act="' + act('skipq') + '">Skip this question</button><button class="ghost" data-act="' + act('end') + '">Stop</button></div></div>';
  }

  function render() {
    const box = panel();
    if (!box) return;
    if (run.mode === 'closed') box.innerHTML = '';
    else if (run.mode === 'done') box.innerHTML = doneHtml();
